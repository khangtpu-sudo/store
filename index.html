<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>English Quest: Tower of Words</title>
<style>
:root{--bg:#10152a;--panel:#1a2240;--panel2:#232d50;--gold:#ffd166;--green:#62d394;--red:#ff6b6b;--blue:#67b7ff;--text:#f4f7ff;--muted:#aeb9d6}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#27376b,#0c1020 65%);color:var(--text);font-family:Inter,system-ui,Segoe UI,sans-serif;min-height:100vh}button{border:0;border-radius:12px;padding:10px 14px;background:var(--panel2);color:var(--text);font-weight:700;cursor:pointer;transition:.15s}button:hover{transform:translateY(-1px);filter:brightness(1.12)}button.primary{background:linear-gradient(135deg,#6c63ff,#9a72ff)}button.good{background:#286e50}button.warn{background:#8c3f4c}.app{max-width:1250px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;background:rgba(16,21,42,.88);backdrop-filter:blur(12px);border:1px solid #334064;border-radius:18px;padding:10px 14px;position:sticky;top:8px;z-index:20}.brand{font-weight:900;font-size:18px}.stats{display:flex;gap:8px;flex-wrap:wrap}.stat{background:#202a49;padding:7px 10px;border-radius:10px;font-size:13px}.screen{margin-top:14px}.world{position:relative;height:min(66vh,620px);min-height:430px;border-radius:22px;overflow:hidden;border:2px solid #3c4b73;background:#75a85b;box-shadow:0 20px 50px #0005}.world.dungeon{background:#27283d}.terrain{position:absolute;inset:0;background-image:linear-gradient(30deg,#0000 40%,#00000008 40%),repeating-linear-gradient(90deg,#ffffff08 0 2px,transparent 2px 50px),repeating-linear-gradient(0deg,#ffffff06 0 2px,transparent 2px 50px)}.lake{position:absolute;background:#4b9bc4;border-radius:50%;width:220px;height:130px;left:60%;top:12%;box-shadow:inset 0 0 30px #216080}.forest{position:absolute;left:4%;top:8%;font-size:70px;opacity:.85}.mountain{position:absolute;right:2%;bottom:2%;font-size:100px;opacity:.65}.location{position:absolute;transform:translate(-50%,-50%);padding:7px 10px;background:#141a2ddd;border:1px solid #61709a;border-radius:10px;font-size:12px;white-space:nowrap}.player{position:absolute;width:42px;height:42px;border-radius:14px;background:linear-gradient(#f5d3a0 0 38%,#5865f2 38%);border:3px solid #fff;box-shadow:0 5px 15px #0007;display:flex;align-items:flex-end;justify-content:center;font-size:21px;z-index:5;transition:left .08s,top .08s}.monster{position:absolute;width:45px;height:45px;border-radius:50%;background:#4b263d;border:2px solid #ff9ca7;display:flex;align-items:center;justify-content:center;font-size:25px;z-index:4;box-shadow:0 5px 14px #0006}.npc{position:absolute;width:42px;height:42px;border-radius:12px;background:#7254a8;border:2px solid #e2c8ff;display:flex;align-items:center;justify-content:center;font-size:24px}.node{position:absolute;font-size:28px;filter:drop-shadow(0 3px 5px #0008)}.hint{position:absolute;left:14px;top:14px;background:#12172bdd;padding:10px 12px;border-radius:12px;font-size:12px}.controls{position:absolute;right:15px;bottom:15px;display:grid;grid-template-columns:repeat(3,52px);gap:6px;z-index:10}.controls button{height:48px;font-size:20px}.controls .up{grid-column:2}.controls .left{grid-column:1}.controls .down{grid-column:2}.controls .right{grid-column:3}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.nav button.active{background:#6758d8}.panel{background:linear-gradient(180deg,#1b2342,#141a31);border:1px solid #354264;border-radius:18px;padding:18px;box-shadow:0 15px 40px #0004}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.card{background:#222c4c;border:1px solid #39476b;border-radius:15px;padding:14px}.bar{height:10px;background:#10152a;border-radius:9px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#65d6a0,#6cb8ff)}.battle{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:14px;align-items:center}.fighter{text-align:center;padding:20px;background:#222a47;border-radius:18px}.avatar{font-size:75px}.question{background:#12182e;border-radius:18px;padding:20px}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.options button{text-align:left}.feedback{margin-top:12px;padding:12px;border-radius:12px;background:#202943}.modal{position:fixed;inset:0;background:#070a14bb;display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}.modal .panel{width:min(760px,100%);max-height:90vh;overflow:auto}.hidden{display:none!important}.title{font-size:28px;font-weight:900;margin:0 0 8px}.muted{color:var(--muted)}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#313d63;font-size:12px}.grade-grid button{min-height:105px}.small{font-size:12px}.review-item{border-left:4px solid var(--red);padding:10px 12px;background:#222a47;border-radius:10px;margin:8px 0}.toast{position:fixed;right:18px;bottom:18px;background:#202a49;border:1px solid #56668f;padding:12px 16px;border-radius:12px;z-index:80;box-shadow:0 8px 25px #0007}.shop-item{display:flex;justify-content:space-between;gap:10px;align-items:center}.lang{min-width:95px}@media(max-width:750px){.top{align-items:flex-start;flex-direction:column}.battle{grid-template-columns:1fr}.world{height:70vh;min-height:500px}.options{grid-template-columns:1fr}.fighter{padding:10px}.avatar{font-size:55px}.location{font-size:10px}.controls{grid-template-columns:repeat(3,48px)} }
</style></head>
<body><div id="app" class="app"></div><div id="modal" class="modal hidden"></div><div id="toast" class="toast hidden"></div>
<script>
const I18N={vi:{play:'Chơi',map:'Bản đồ',bag:'Túi đồ',shop:'Cửa hàng',mistakes:'Sổ lỗi',profile:'Hồ sơ',dungeon:'Hầm ngục',tower:'Tháp',choose:'Chọn lớp',world:'Thế giới',hp:'HP',mana:'Mana',gold:'Vàng',level:'Cấp',exp:'EXP',streak:'Chuỗi',attack:'Công',defense:'Thủ',hint:'Gợi ý',skip:'Bỏ qua',back:'Quay lại',correct:'Chính xác!',wrong:'Sai rồi!',review:'Ôn lỗi',buy:'Mua',close:'Đóng',start:'Bắt đầu',boss:'Boss',practice:'Luyện lỗi này',settings:'Cài đặt',language:'Ngôn ngữ',easy:'Dễ',normal:'Thường',medium:'Trung bình',hard:'Khó'},en:{play:'Play',map:'Map',bag:'Inventory',shop:'Shop',mistakes:'Mistake Book',profile:'Profile',dungeon:'Dungeon',tower:'Tower',choose:'Choose grade',world:'World',hp:'HP',mana:'Mana',gold:'Gold',level:'Level',exp:'EXP',streak:'Streak',attack:'ATK',defense:'DEF',hint:'Hint',skip:'Skip',back:'Back',correct:'Correct!',wrong:'Not quite!',review:'Review mistakes',buy:'Buy',close:'Close',start:'Start',boss:'Boss',practice:'Practice this mistake',settings:'Settings',language:'Language',easy:'Easy',normal:'Normal',medium:'Medium',hard:'Hard'}};
let lang='vi';const t=k=>I18N[lang][k]||k;
const worlds=[{grade:6,name:'Green Valley',emoji:'🌳',topics:['Family','School','Friends','Animals','Food','Daily activities','Hobbies','Places']},{grade:7,name:'Crystal Forest',emoji:'💎',topics:['Health','Environment','Travel','Community','Hobbies','Communication']},{grade:8,name:'Mystic Kingdom',emoji:'🔮',topics:['Natural disasters','Science','Technology','Life','Culture','Environment']},{grade:9,name:'Dragon Valley',emoji:'🐉',topics:['Grammar','Reading','Vocabulary','Communication','Sentence transformation']},{grade:10,name:'Ancient Academy',emoji:'🏛️',topics:['Grammar','Reading','Vocabulary','Communication']},{grade:11,name:'Shadow Empire',emoji:'🌑',topics:['Reading','Grammar','Vocabulary','Critical thinking']},{grade:12,name:'Final Kingdom',emoji:'⚡',topics:['Exam grammar','Reading','Vocabulary','Translation']}];
const questions=[
{id:'g6-001',grade:6,topic:'School',skill:'Grammar',difficulty:1,type:'mc',q:'She ___ to school every day.',o:['go','goes','going','gone'],a:'goes',e:'Với He/She/It ở hiện tại đơn, động từ thường thêm -s/-es.'},
{id:'g6-002',grade:6,topic:'Family',skill:'Vocabulary',difficulty:1,type:'mc',q:'Your mother’s sister is your ___.',o:['uncle','cousin','aunt','niece'],a:'aunt',e:'Aunt = cô/dì; uncle = chú/cậu/bác trai.'},
{id:'g6-003',grade:6,topic:'Animals',skill:'Vocabulary',difficulty:1,type:'fill',q:'A baby dog is called a ___.',a:'puppy',e:'Puppy means a young dog.'},
{id:'g6-004',grade:6,topic:'Daily activities',skill:'Grammar',difficulty:2,type:'mc',q:'I ___ breakfast at 7 o’clock yesterday.',o:['have','had','has','having'],a:'had',e:'Yesterday cho biết quá khứ đơn; have → had.'},
{id:'g6-005',grade:6,topic:'Food',skill:'Vocabulary',difficulty:1,type:'mc',q:'Which word means “táo”?',o:['apple','orange','bread','rice'],a:'apple',e:'Apple = quả táo.'},
{id:'g6-006',grade:6,topic:'Hobbies',skill:'Grammar',difficulty:2,type:'arrange',q:'Arrange: usually / I / books / read',a:'I usually read books.',e:'Trạng từ tần suất usually thường đứng trước động từ thường.'},
{id:'g6-007',grade:6,topic:'Places',skill:'Vocabulary',difficulty:1,type:'mc',q:'You can borrow books at a ___.',o:['hospital','library','stadium','bakery'],a:'library',e:'Library = thư viện.'},
{id:'g6-008',grade:6,topic:'Friends',skill:'Communication',difficulty:2,type:'mc',q:'“Would you like some juice?” — “___”',o:['Yes, please.','I am twelve.','See you yesterday.','No, I do.'],a:'Yes, please.',e:'Yes, please là câu trả lời lịch sự khi nhận lời mời.'},
{id:'g7-001',grade:7,topic:'Health',skill:'Grammar',difficulty:2,type:'mc',q:'You should ___ enough water every day.',o:['drink','drinks','drank','drinking'],a:'drink',e:'Sau should dùng động từ nguyên mẫu.'},
{id:'g8-001',grade:8,topic:'Technology',skill:'Vocabulary',difficulty:3,type:'mc',q:'A device used to connect to the internet wirelessly is a ___.',o:['router','helmet','pillow','ladder'],a:'router',e:'Router là thiết bị định tuyến mạng.'},
{id:'g9-001',grade:9,topic:'Grammar',skill:'Sentence transformation',difficulty:3,type:'mc',q:'“I started learning English two years ago.” = “I have ___ English for two years.”',o:['learn','learned','learning','been learning'],a:'been learning',e:'Hành động bắt đầu trong quá khứ và kéo dài đến hiện tại có thể dùng have been + V-ing.'},
{id:'g10-001',grade:10,topic:'Reading',skill:'Reading',difficulty:4,type:'mc',q:'If a passage says a town reduced plastic waste by 30%, what changed?',o:['Plastic waste decreased.','The town grew 30%.','People stopped recycling.','Water became 30% cleaner.'],a:'Plastic waste decreased.',e:'Reduced by 30% nghĩa là giảm 30%.'}
];
const defaultState=()=>({grade:null,level:1,exp:0,gold:150,hp:100,maxHp:100,mana:80,maxMana:80,atk:10,def:5,streak:0,inventory:{potion:2,mana:1,hint:3,skip:1,shield:1},equipment:['Novice Sword'],mistakes:{},history:[],kills:0,bosses:0,worlds:[6],x:50,y:65,monsters:[],mode:'map',dungeonFloor:0,towerFloor:0});
let S=JSON.parse(localStorage.getItem('englishQuestSave')||'null')||defaultState();
function save(){localStorage.setItem('englishQuestSave',JSON.stringify(S))}function toast(m){let e=document.getElementById('toast');e.textContent=m;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),1800)}
function xpNeed(){return 120+(S.level-1)*90}function addExp(n){S.exp+=n;while(S.exp>=xpNeed()){S.exp-=xpNeed();S.level++;S.maxHp+=10;S.maxMana+=5;S.atk+=2;S.def+=1;S.hp=S.maxHp;toast('✨ Level Up! Level '+S.level)}save()}
function nav(){return `<div class="nav">${[['map','🗺️ '+t('map')],['bag','🎒 '+t('bag')],['shop','🏪 '+t('shop')],['mistakes','📖 '+t('mistakes')],['profile','👤 '+t('profile')]].map(([m,l])=>`<button class="${S.mode===m?'active':''}" onclick="setMode('${m}')">${l}</button>`).join('')}<button onclick="setLang()">🌐 ${lang==='vi'?'EN':'VI'}</button></div>`}
function header(){return `<div class="top"><div class="brand">⚔️ English Quest <span class="muted">· Tower of Words</span></div><div class="stats"><span class="stat">❤️ ${S.hp}/${S.maxHp}</span><span class="stat">⚡ ${S.mana}/${S.maxMana}</span><span class="stat">💰 ${S.gold}</span><span class="stat">⭐ Lv.${S.level}</span><span class="stat">🔥 ${S.streak}</span></div></div>`}
function render(){const app=document.getElementById('app');app.innerHTML=header()+'<div class="screen">'+(S.grade?content():gradeSelect())+nav()+'</div>';if(S.mode==='map')bindKeys()}
function gradeSelect(){return `<div class="panel"><p class="title">🌎 ${t('choose')}</p><p class="muted">Chọn chương trình để mở thế giới tương ứng. Bạn có thể đổi lớp trong hồ sơ.</p><div class="grid grade-grid">${worlds.map(w=>`<button class="card" onclick="chooseGrade(${w.grade})"><div style="font-size:42px">${w.emoji}</div><b>Lớp ${w.grade}</b><div>${w.name}</div><small class="muted">${w.topics.slice(0,3).join(' · ')}</small></button>`).join('')}</div></div>`}
function content(){if(S.mode==='map')return mapView();if(S.mode==='bag')return bagView();if(S.mode==='shop')return shopView();if(S.mode==='mistakes')return mistakesView();if(S.mode==='profile')return profileView();if(S.mode==='dungeon')return dungeonView();if(S.mode==='battle')return battleView();return mapView()}
function chooseGrade(g){S.grade=g;S.worlds=[g];S.x=50;S.y=65;S.monsters=[];save();render()}
function mapView(){let w=worlds.find(x=>x.grade===S.grade);if(!S.monsters.length)spawnMonsters();return `<div class="world"><div class="terrain"></div><div class="lake"></div><div class="forest">🌲🌲🌲</div><div class="mountain">⛰️</div><div class="hint">${w.emoji} <b>${w.name}</b> · Lớp ${w.grade}<br><span class="muted">WASD / Arrow keys hoặc nút điều khiển · Chạm quái để chiến đấu</span></div><div class="location" style="left:18%;top:82%">🏘️ Village</div><div class="location" style="left:48%;top:22%">🏰 Dungeon</div><div class="location" style="left:82%;top:76%">🏯 Tower</div><div class="location" style="left:79%;top:25%">👑 Boss Arena</div><div class="node" style="left:47%;top:17%">💎</div><div class="node" style="left:88%;top:56%">💰</div><div class="npc" style="left:25%;top:48%">🦉</div><div class="location" style="left:25%;top:55%">Professor Owl</div><div id="player" class="player" style="left:${S.x}%;top:${S.y}%">🧙</div>${S.monsters.map((m,i)=>`<button class="monster" title="${m.name}" style="left:${m.x}%;top:${m.y}%" onclick="encounter(${i})">${m.emoji}</button>`).join('')}<div class="controls"><button class="up" onclick="move(0,-1)">▲</button><button class="left" onclick="move(-1,0)">◀</button><button class="down" onclick="move(0,1)">▼</button><button class="right" onclick="move(1,0)">▶</button></div></div><div class="grid" style="margin-top:12px"><div class="card"><b>🗺️ Exploration</b><p class="muted small">Khám phá Green Valley, tìm quái, kho báu và cổng dungeon.</p></div><div class="card"><b>🏰 Dungeon</b><p class="muted small">10 tầng · quái mạnh dần · tầng cuối có boss.</p><button onclick="startDungeon()">${t('start')}</button></div><div class="card"><b>🏯 Tower of Knowledge</b><p class="muted small">50 tầng trong bản đầy đủ; prototype có 5 tầng đầu.</p><button onclick="startTower()">${t('start')}</button></div></div>`}
function spawnMonsters(){S.monsters=[{name:'Slime',emoji:'🟢',hp:45,max:45,atk:8,x:35,y:35,d:1},{name:'Goblin',emoji:'👹',hp:60,max:60,atk:10,x:61,y:49,d:2},{name:'Bat',emoji:'🦇',hp:50,max:50,atk:9,x:72,y:38,d:1},{name:'Wolf',emoji:'🐺',hp:70,max:70,atk:12,x:38,y:72,d:2}];save()}
function move(dx,dy){S.x=Math.max(5,Math.min(92,S.x+dx*2.5));S.y=Math.max(8,Math.min(88,S.y+dy*2.5));for(let i=0;i<S.monsters.length;i++){let m=S.monsters[i];if(Math.abs(S.x-m.x)<5&&Math.abs(S.y-m.y)<5){encounter(i);break}}save();render()}
let keyHandler;function bindKeys(){if(keyHandler)window.removeEventListener('keydown',keyHandler);keyHandler=e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;let k=e.key.toLowerCase();if(k==='w'||k==='arrowup')move(0,-1);if(k==='s'||k==='arrowdown')move(0,1);if(k==='a'||k==='arrowleft')move(-1,0);if(k==='d'||k==='arrowright')move(1,0)};window.addEventListener('keydown',keyHandler)}
function encounter(i){const m=S.monsters[i];S.battle={monster:m,index:i,step:0,answered:false,current:null};S.mode='battle';render()}
function pickQuestion(){let grade=S.grade||6;let pool=questions.filter(q=>q.grade===grade);if(!pool.length)pool=questions.filter(q=>q.grade===6);let recent=new Set(S.history.slice(-6).map(x=>x.id));let mistake=Object.keys(S.mistakes).sort((a,b)=>S.mistakes[b].count-S.mistakes[a].count);let preferred=pool.filter(q=>mistake.includes(q.id));let candidates=(preferred.length&&Math.random()<.45?preferred:pool).filter(q=>!recent.has(q.id));if(!candidates.length)candidates=pool;let q=candidates[Math.floor(Math.random()*candidates.length)];S.battle.current=q;return q}
function battleView(){let b=S.battle;if(!b)return mapView();let m=b.monster;if(!b.current)pickQuestion();let q=b.current;return `<div class="panel"><div class="row"><button onclick="setMode('map')">← ${t('back')}</button><span class="badge">${q.skill} · ${'⭐'.repeat(q.difficulty)}</span></div><div class="battle" style="margin-top:12px"><div class="fighter"><div class="avatar">${m.emoji}</div><b>${m.name}</b><div class="bar"><div class="fill" style="width:${m.hp/m.max*100}%"></div></div><small>${m.hp}/${m.max} HP</small></div><div class="question"><h2>${q.q}</h2>${questionInput(q)}<div id="feedback"></div></div><div class="fighter"><div class="avatar">🧙</div><b>Player</b><p>❤️ ${S.hp}/${S.maxHp}</p><p>⚔️ ${S.atk} · 🛡️ ${S.def}</p><p>🔥 Combo ${S.battle.combo||0}</p></div></div></div>`}
function questionInput(q){if(q.type==='fill')return `<input id="answer" style="width:100%;padding:13px;border-radius:10px;border:1px solid #526080;background:#0f1428;color:white" placeholder="Type your answer..."><button class="primary" style="margin-top:10px" onclick="answer(document.getElementById('answer').value)">⚔️ Attack</button>`;if(q.type==='arrange')return `<input id="answer" style="width:100%;padding:13px;border-radius:10px;border:1px solid #526080;background:#0f1428;color:white" placeholder="I usually read books."><button class="primary" style="margin-top:10px" onclick="answer(document.getElementById('answer').value)">⚔️ Attack</button>`;return `<div class="options">${q.o.map(x=>`<button onclick="answer('${x.replace(/'/g,"\\'")}')">${x}</button>`).join('')}</div><div class="row" style="margin-top:12px"><button onclick="useHint()">💡 ${t('hint')} (${S.inventory.hint||0})</button><button onclick="useSkip()">⏭️ ${t('skip')} (${S.inventory.skip||0})</button></div>`}
function answer(raw){if(S.battle.answered)return;let q=S.battle.current;let clean=x=>String(x||'').trim().toLowerCase().replace(/[.!?]+$/,'');let ok=clean(raw)===clean(q.a);S.history.push({id:q.id,at:Date.now(),correct:ok});if(S.history.length>100)S.history.shift();if(!ok){S.mistakes[q.id]=S.mistakes[q.id]||{count:0,correct:0,last:0};S.mistakes[q.id].count++;S.mistakes[q.id].last=Date.now();S.battle.combo=0;let dmg=Math.max(4,S.battle.monster.atk-S.def/3);S.hp=Math.max(0,Math.round(S.hp-dmg));showFeedback(false,q,`Quái tấn công bạn! -${Math.round(dmg)} HP`);if(S.hp<=0){S.hp=Math.max(1,Math.round(S.maxHp*.5));toast('Bạn đã kiệt sức, nhưng có thể tiếp tục sau khi hồi phục.')}}else{S.mistakes[q.id]&&(S.mistakes[q.id].correct=(S.mistakes[q.id].correct||0)+1);S.battle.combo=(S.battle.combo||0)+1;let dmg=S.atk+S.battle.combo*2;S.battle.monster.hp=Math.max(0,S.battle.monster.hp-dmg);addExp(18+q.difficulty*6);S.gold+=8+q.difficulty*4;showFeedback(true,q,`Đòn đánh gây ${dmg} sát thương!`);if(S.battle.monster.hp<=0){winBattle();return}}save();}
function showFeedback(ok,q,msg){let f=document.getElementById('feedback');if(!f)return;f.innerHTML=`<div class="feedback"><b>${ok?'✅ '+t('correct'):'❌ '+t('wrong')}</b><p>${msg}</p>${!ok?`<p><b>Đáp án:</b> ${q.a}</p>`:''}<p>📚 <b>Why?</b> ${q.e}</p><button class="good" onclick="nextQuestion()">Continue</button></div>`}
function nextQuestion(){if(S.battle.monster.hp<=0)return winBattle();S.battle.current=null;save();render()}
function winBattle(){let m=S.battle.monster;S.kills++;S.streak++;S.gold+=15;S.battle.answered=true;S.monsters.splice(S.battle.index,1);toast(`🏆 ${m.name} defeated! +EXP +Gold`);S.mode='map';save();render()}
function useHint(){if((S.inventory.hint||0)<=0){toast('Hết Hint');return}S.inventory.hint--;let q=S.battle.current;if(q.o){let wrong=q.o.filter(x=>x!==q.a).sort(()=>Math.random()-.5).slice(0,2);let f=document.getElementById('feedback');f.innerHTML=`<div class="feedback">💡 Hint: loại bỏ <b>${wrong.join('</b>, <b>')}</b></div>`}else toast('💡 '+q.e);save()}
function useSkip(){if((S.inventory.skip||0)<=0){toast('Hết Skip Ticket');return}S.inventory.skip--;S.battle.current=null;save();render()}
function bagView(){return `<div class="panel"><h2>🎒 ${t('bag')}</h2><div class="grid">${Object.entries({potion:'❤️ Health Potion',mana:'⚡ Mana Potion',hint:'💡 Hint',skip:'⏭️ Skip Ticket',shield:'🛡️ Shield'}).map(([k,n])=>`<div class="card"><b>${n}</b><div style="font-size:25px;margin:8px 0">${S.inventory[k]||0}</div>${k==='potion'?'<button onclick="usePotion()">Use</button>':''}${k==='mana'?'<button onclick="useMana()">Use</button>':''}</div>`).join('')}</div><h3>⚔️ Equipment</h3><div class="grid">${S.equipment.map(x=>`<div class="card">✨ ${x}</div>`).join('')}</div></div>`}
function usePotion(){if(S.inventory.potion>0&&S.hp<S.maxHp){S.inventory.potion--;S.hp=Math.min(S.maxHp,S.hp+40);save();render()}}function useMana(){if(S.inventory.mana>0){S.inventory.mana--;S.mana=Math.min(S.maxMana,S.mana+35);save();render()}}
function shopView(){let items=[['potion','❤️ Health Potion',35,'Hồi 40 HP'],['mana','⚡ Mana Potion',35,'Hồi 35 Mana'],['hint','💡 Hint',45,'Gợi ý'],['skip','⏭️ Skip Ticket',70,'Bỏ qua câu hỏi'],['shield','🛡️ Shield',80,'Chặn một lần tấn công'],['exp','🔥 EXP Boost',120,'Nhận thêm EXP trong MVP']];return `<div class="panel"><div class="row"><h2>🏪 ${t('shop')}</h2><b>💰 ${S.gold}</b></div><div class="grid">${items.map(([k,n,p,d])=>`<div class="card shop-item"><div><b>${n}</b><p class="muted small">${d}</p></div><button onclick="buy('${k}',${p})">${p} 💰</button></div>`).join('')}</div></div>`}
function buy(k,p){if(S.gold<p){toast('Không đủ vàng');return}S.gold-=p;if(k==='exp')addExp(60);else S.inventory[k]=(S.inventory[k]||0)+1;save();render();toast('Mua thành công!')}
function mistakesView(){let arr=Object.entries(S.mistakes).sort((a,b)=>b[1].count-a[1].count);return `<div class="panel"><div class="row"><div><h2>📖 ${t('mistakes')}</h2><p class="muted">Hệ thống ưu tiên các lỗi bạn thường mắc.</p></div><span class="badge">${arr.length} skills</span></div>${arr.length?arr.map(([id,v])=>{let q=questions.find(x=>x.id===id);return `<div class="review-item"><div class="row"><b>${q?.q||id}</b><span>❌ ${v.count} · ✅ ${v.correct||0}</span></div><div class="small muted">${q?.topic||''} · ${q?.skill||''}</div><div class="small">Đúng: <b>${q?.a||''}</b> · ${q?.e||''}</div><button onclick="practice('${id}')">${t('practice')}</button></div>`}).join(''):'<div class="card">🎉 Chưa có lỗi. Hãy chiến đấu để xây dựng Sổ lỗi!</div>'}</div>`}
function practice(id){let q=questions.find(x=>x.id===id);if(!q)return;S.battle={monster:{name:'Review Dummy',emoji:'📚',hp:30,max:30,atk:0},index:-1,current:q,combo:0};S.mode='battle';render()}
function profileView(){let total=S.history.length,correct=S.history.filter(x=>x.correct).length,acc=total?Math.round(correct/total*100):0;let skills=['Vocabulary','Grammar','Reading','Listening','Translation'];return `<div class="panel"><h2>👤 Player Profile</h2><div class="grid"><div class="card"><div style="font-size:60px">🧙</div><h2>Level ${S.level}</h2><div class="bar"><div class="fill" style="width:${S.exp/xpNeed()*100}%"></div></div><p>${S.exp}/${xpNeed()} EXP</p></div><div class="card"><b>⚔️ Combat</b><p>❤️ ${S.hp}/${S.maxHp}</p><p>⚔️ ATK ${S.atk}</p><p>🛡️ DEF ${S.def}</p><p>👹 ${S.kills} monsters · 👑 ${S.bosses} bosses</p></div><div class="card"><b>📊 Learning</b><p>Questions: ${total}</p><p>Accuracy: <b>${acc}%</b></p><p>🔥 Streak: ${S.streak}</p>${skills.map(k=>`<div class="small">${k}</div><div class="bar"><div class="fill" style="width:${Math.min(95,40+(S.history.filter(x=>{let q=questions.find(y=>y.id===x.id);return q?.skill===k&&x.correct}).length*10))}%"></div></div>`).join('')}</div></div><hr style="border-color:#334064"><h3>🌎 Worlds</h3><div class="grid">${worlds.map(w=>`<button class="card" onclick="chooseGrade(${w.grade})">${w.emoji} <b>World ${w.grade}</b><br>${w.name}<br><span class="small">${S.worlds.includes(w.grade)?'🔓 Unlocked':'🔒 Locked'}</span></button>`).join('')}</div></div>`}
function startDungeon(){S.mode='dungeon';S.dungeonFloor=1;save();render()}function startTower(){S.mode='dungeon';S.towerFloor=1;S.inTower=true;save();render()}
function dungeonView(){let floor=S.inTower?S.towerFloor:S.dungeonFloor;let max=S.inTower?5:5;let title=S.inTower?'🏯 Tower of Knowledge':'🏰 Forest Dungeon';return `<div class="panel"><div class="row"><h2>${title}</h2><button onclick="setMode('map')">← ${t('back')}</button></div><div class="card" style="text-align:center;padding:30px"><div style="font-size:70px">${floor===max?'👑':'👹'}</div><h2>Floor ${floor}/${max}</h2><p class="muted">Câu hỏi khó dần. Tầng cuối là ${t('boss')}.</p><button class="primary" onclick="dungeonFight()">⚔️ Enter Floor</button></div></div>`}
function dungeonFight(){let boss=(S.inTower?S.towerFloor:S.dungeonFloor)>=5;let m=boss?{name:S.inTower?'Tower Guardian':'Dungeon Boss',emoji:S.inTower?'🧿':'🐲',hp:120,max:120,atk:18,d:4}:{name:'Elite '+(S.inTower?'Scholar':'Orc'),emoji:S.inTower?'🧙‍♂️':'👺',hp:80,max:80,atk:13,d:3};S.battle={monster:m,index:-1,current:null,combo:0,dungeonBoss:boss};S.mode='battle';render()}
function setMode(m){S.mode=m;if(m==='map'&&S.grade&&!S.monsters.length)spawnMonsters();save();render()}function setLang(){lang=lang==='vi'?'en':'vi';localStorage.setItem('eqLang',lang);render()}lang=localStorage.getItem('eqLang')||'vi';render();
</script></body></html>
