<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>English Quest: Tower of Words</title>
<style>
:root{--bg:#080d19;--p:#151f39;--p2:#202c4e;--line:#405275;--text:#f5f7ff;--muted:#afbdd9;--a:#8066f5;--good:#43ce8b;--bad:#ff6576}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#2b3e73,#080d19 65%);color:var(--text);font:15px system-ui,Segoe UI,sans-serif}button,input{font:inherit}button{border:1px solid #46587e;background:#283657;color:#fff;border-radius:11px;padding:10px 13px;font-weight:750;cursor:pointer}button:hover{filter:brightness(1.14)}button:active{transform:translateY(1px)}button.primary{background:linear-gradient(135deg,#6653df,#9b68f5);border:0}.app{max-width:1280px;margin:auto;padding:12px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#11182cdd;border:1px solid #344665;border-radius:17px;padding:11px 14px;position:sticky;top:8px;z-index:40;backdrop-filter:blur(8px)}.brand{font-size:18px;font-weight:950}.stats{display:flex;gap:7px;flex-wrap:wrap}.stat,.badge{background:#222e4f;border-radius:9px;padding:7px 9px;font-size:12px}.panel{margin-top:12px;background:linear-gradient(#182340,#10182c);border:1px solid #354767;border-radius:19px;padding:15px;box-shadow:0 18px 55px #0005}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:11px}.card{background:#202c4b;border:1px solid #3b4d72;border-radius:14px;padding:14px}.muted{color:var(--muted)}.title{margin:0 0 8px;font-size:27px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}.nav button.active{background:var(--a);border-color:transparent}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.world{position:relative;height:min(690px,72vh);min-height:510px;overflow:hidden;border:2px solid #536990;border-radius:21px;background:linear-gradient(#83b867 0 40%,#6ba252 40%)}.world:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 47px,#ffffff0a 48px),repeating-linear-gradient(90deg,transparent 0 47px,#ffffff08 48px);pointer-events:none}.world:after{content:"";position:absolute;left:8%;right:8%;top:56%;height:22px;background:#c4a56b;border-radius:30px;transform:rotate(-7deg);box-shadow:0 46px #c4a56b;opacity:.9;pointer-events:none}.lake{position:absolute;width:280px;height:150px;right:7%;top:9%;border-radius:50%;background:#4a9fc4;border:3px solid #2e6c91}.trees{position:absolute;left:2%;top:4%;font-size:60px}.mountain{position:absolute;right:-1%;bottom:-17px;font-size:130px;opacity:.6}.place{position:absolute;z-index:3;transform:translate(-50%,-50%);background:#10172bd9;border:1px solid #7183aa;border-radius:10px;padding:7px 10px;font-size:11px;white-space:nowrap}.npc{position:absolute;z-index:6;width:52px;height:52px;border-radius:14px;background:#7657ab;border:2px solid #e8d5ff;display:grid;place-items:center;font-size:29px}.player{position:absolute;z-index:12;width:54px;height:62px;display:grid;place-items:center;font-size:43px;filter:drop-shadow(0 6px 4px #0008);will-change:left,top}.player.walk{animation:bob .12s infinite alternate}@keyframes bob{to{margin-top:-5px}}.monster{position:absolute;z-index:10;width:54px;height:54px;padding:0;border-radius:50%;display:grid;place-items:center;font-size:29px;background:#49283f;border:2px solid #ff9ca8}.controls{position:absolute;right:14px;bottom:14px;z-index:30;display:grid;grid-template-columns:58px 58px 58px;grid-template-rows:58px 58px;gap:6px}.controls button{height:58px;padding:0;font-size:21px;background:#141d35e8}.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}.move-note{position:absolute;z-index:20;left:14px;bottom:14px;background:#10172bcc;border:1px solid #53658b;border-radius:10px;padding:8px 10px;font-size:12px}
.battle{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:12px;align-items:center}.fighter{text-align:center;background:#202c4b;border:1px solid #3b4d70;border-radius:16px;padding:15px}.avatar{font-size:70px}.bar{height:11px;background:#0a1020;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#43ce8b;transition:.25s}.question{background:#0d1428;border:1px solid #344665;border-radius:16px;padding:18px}.question h2{line-height:1.4}.options{display:grid;grid-template-columns:1fr 1fr;gap:9px}.answer{width:100%;padding:12px;border-radius:10px;border:1px solid #4b5e87;background:#080e1b;color:#fff;outline:none}.answer:focus{border-color:#8c75ff}.feedback{margin-top:11px;padding:12px;border-radius:12px;background:#222e4f}.feedback.good{border-left:4px solid var(--good)}.feedback.bad{border-left:4px solid var(--bad)}.progress{height:10px;background:#0b1120;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:#5ca4f5}.review{margin:8px 0;padding:11px;border-radius:11px;background:#202c4b;border:1px solid #3a4b70;border-left:4px solid var(--bad)}.toast{position:fixed;right:16px;bottom:16px;z-index:100;background:#263556;border:1px solid #667aa3;padding:12px 15px;border-radius:12px;box-shadow:0 12px 40px #0008}.hidden{display:none}.small{font-size:12px}@media(max-width:760px){.app{padding:8px}.top{position:relative;top:0;flex-direction:column;align-items:flex-start}.world{height:70vh;min-height:520px}.battle{grid-template-columns:1fr}.options{grid-template-columns:1fr}.avatar{font-size:54px}.move-note{display:none}.nav button{flex:1 1 auto}}
</style>
</head>
<body><main id="app" class="app"></main><div id="toast" class="toast hidden"></div>
<script>
'use strict';
/* ========================= DATA ========================= */
const WORLDS=[
{grade:6,name:'Green Valley',icon:'🌳',topics:['Family','School','Friends','Animals','Food','Daily activities','Hobbies','Places']},
{grade:7,name:'Crystal Forest',icon:'💎',topics:['Health','Environment','Travel','Community','Hobbies','Communication']},
{grade:8,name:'Mystic Kingdom',icon:'🔮',topics:['Natural disasters','Science','Technology','Life','Culture','Environment']},
{grade:9,name:'Dragon Valley',icon:'🐉',topics:['Grammar','Reading','Vocabulary','Communication','Sentence transformation']},
{grade:10,name:'Ancient Academy',icon:'🏛️',topics:['Grammar','Reading','Vocabulary','Communication']},
{grade:11,name:'Shadow Empire',icon:'🌑',topics:['Reading','Grammar','Vocabulary','Critical thinking']},
{grade:12,name:'Final Kingdom',icon:'⚡',topics:['Exam grammar','Reading','Vocabulary','Translation']}];
const VERBS=[['play','plays','played'],['watch','watches','watched'],['study','studies','studied'],['wash','washes','washed'],['visit','visits','visited'],['carry','carries','carried'],['go','goes','went'],['have','has','had'],['do','does','did'],['try','tries','tried'],['read','reads','read'],['make','makes','made']];
const OBJECTS=['football','English','books','music','chess','the piano','cartoons','computer games','science','breakfast','homework','stories'];
const VOCAB=[['library','thư viện'],['hospital','bệnh viện'],['forest','khu rừng'],['journey','hành trình'],['healthy','khỏe mạnh'],['pollution','ô nhiễm'],['recycle','tái chế'],['festival','lễ hội'],['neighbor','hàng xóm'],['environment','môi trường'],['technology','công nghệ'],['community','cộng đồng'],['adventure','cuộc phiêu lưu'],['equipment','trang thiết bị'],['protect','bảo vệ'],['discover','khám phá'],['dangerous','nguy hiểm'],['ancient','cổ đại'],['culture','văn hóa'],['communication','giao tiếp']];
const QUESTIONS=[];let qid=0;function add(q){qid++;QUESTIONS.push({id:'Q'+String(qid).padStart(5,'0'),...q})}
for(const w of WORLDS){for(let i=0;i<500;i++){const topic=w.topics[i%w.topics.length],difficulty=Math.min(5,1+Math.floor(i/100)),v=VERBS[i%VERBS.length],obj=OBJECTS[i%OBJECTS.length];if(i%4===0){const plural=i%3===1,sub=plural?'They':i%3===2?'He':'She',a=plural?v[0]:v[1];add({grade:w.grade,world:w.name,topic,skill:'Grammar',difficulty,type:'mc',question:`${sub} ___ ${obj} every day.`,options:[a,plural?v[1]:v[0],v[2],'going'],correctAnswer:a,explanation:plural?'They dùng động từ nguyên mẫu ở hiện tại đơn.':'He/She + V(s/es) ở hiện tại đơn.'})}else if(i%4===1){const x=VOCAB[i%VOCAB.length];add({grade:w.grade,world:w.name,topic,skill:'Vocabulary',difficulty,type:'mc',question:`Which word means “${x[1]}”?`,options:[x[0],'window','station','garden'],correctAnswer:x[0],explanation:`${x[0]} = ${x[1]}.`})}else if(i%4===2){add({grade:w.grade,world:w.name,topic,skill:'Grammar',difficulty,type:'fill',question:`Yesterday, I ___ ${obj}.`,options:[],correctAnswer:v[2],explanation:`“Yesterday” báo hiệu quá khứ đơn: ${v[0]} → ${v[2]}.`})}else{const sub=i%2?'I':'My friend',verb=sub==='I'?v[0]:v[1];add({grade:w.grade,world:w.name,topic,skill:'Sentence arrangement',difficulty,type:'arrange',question:`Arrange: ${verb} / ${obj} / ${sub}.`,options:[],correctAnswer:`${sub} ${verb} ${obj}.`,explanation:'Trật tự cơ bản: Subject + Verb + Object.'})}}}
/* ========================= SAVE ========================= */
const DEFAULT={grade:null,level:1,exp:0,gold:150,hp:100,maxHp:100,mana:80,maxMana:80,atk:10,def:5,streak:0,x:50,y:65,mode:'map',monsters:[],history:[],mistakes:{},inventory:{potion:2,mana:1,hint:3,skip:1,shield:1},equipment:['Novice Sword'],kills:0,bosses:0,floor:0,tower:false};
let stored={};try{stored=JSON.parse(localStorage.getItem('englishQuestSave')||'{}')||{}}catch(e){}const S=Object.assign({},DEFAULT,stored);S.inventory=Object.assign({},DEFAULT.inventory,stored.inventory||{});S.history=Array.isArray(stored.history)?stored.history:[];S.mistakes=stored.mistakes||{};
let lang=localStorage.getItem('englishQuestLang')||'vi';const UI={vi:{map:'Bản đồ',bag:'Túi đồ',shop:'Cửa hàng',mistakes:'Sổ lỗi',profile:'Hồ sơ',choose:'Chọn lớp',start:'Bắt đầu',back:'Quay lại',hint:'Gợi ý',skip:'Bỏ qua',practice:'Luyện lại',dungeon:'Hầm ngục',tower:'Tháp',correct:'Chính xác!',wrong:'Sai rồi!',attack:'Tấn công'},en:{map:'Map',bag:'Inventory',shop:'Shop',mistakes:'Mistake Book',profile:'Profile',choose:'Choose grade',start:'Start',back:'Back',hint:'Hint',skip:'Skip',practice:'Practice',dungeon:'Dungeon',tower:'Tower',correct:'Correct!',wrong:'Not quite!',attack:'Attack'}};const t=k=>UI[lang][k]||k;
function save(){localStorage.setItem('englishQuestSave',JSON.stringify(S))}function toast(x){const e=document.getElementById('toast');e.textContent=x;e.classList.remove('hidden');clearTimeout(window._toast);window._toast=setTimeout(()=>e.classList.add('hidden'),1700)}function needXP(){return 120+(S.level-1)*90}function gainXP(n){S.exp+=n;while(S.exp>=needXP()){S.exp-=needXP();S.level++;S.maxHp+=10;S.maxMana+=5;S.atk+=2;S.def++;S.hp=S.maxHp;toast('✨ Level Up! Lv.'+S.level)}save()}
/* ========================= UI ========================= */
function header(){return `<header class="top"><div class="brand">⚔️ English Quest <span class="muted">· Tower of Words</span></div><div class="stats"><span class="stat">❤️ ${S.hp}/${S.maxHp}</span><span class="stat">⚡ ${S.mana}/${S.maxMana}</span><span class="stat">💰 ${S.gold}</span><span class="stat">⭐ Lv.${S.level}</span><span class="stat">🔥 ${S.streak}</span></div></header>`}
function nav(){return `<nav class="nav">${[['map','🗺️ '+t('map')],['bag','🎒 '+t('bag')],['shop','🏪 '+t('shop')],['mistakes','📖 '+t('mistakes')],['profile','👤 '+t('profile')]].map(a=>`<button class="${S.mode===a[0]?'active':''}" onclick="setMode('${a[0]}')">${a[1]}</button>`).join('')}<button onclick="toggleLang()">🌐 ${lang==='vi'?'EN':'VI'}</button></nav>`}
function render(){document.getElementById('app').innerHTML=header()+view()+nav();if(S.mode==='map')bindTouchControls();updatePlayer()}
function view(){if(!S.grade)return chooseScreen();return S.mode==='map'?mapScreen():S.mode==='battle'?battleScreen():S.mode==='bag'?bagScreen():S.mode==='shop'?shopScreen():S.mode==='mistakes'?mistakesScreen():S.mode==='profile'?profileScreen():S.mode==='dungeon'?dungeonScreen():mapScreen()}
function chooseScreen(){return `<section class="panel"><h1 class="title">🌎 ${t('choose')}</h1><p class="muted">Question Engine hiện có <b>${QUESTIONS.length.toLocaleString()}</b> câu. Mỗi lớp có 500 câu.</p><div class="grid">${WORLDS.map(w=>`<button class="card" onclick="chooseGrade(${w.grade})"><div style="font-size:45px">${w.icon}</div><b>Lớp ${w.grade} · ${w.name}</b><p class="muted">${w.topics.slice(0,5).join(' · ')}</p><span class="badge">500 questions</span></button>`).join('')}</div></section>`}
function chooseGrade(g){S.grade=g;S.mode='map';S.x=50;S.y=65;spawnMonsters();save();render()}
function setMode(m){S.mode=m;save();render()}function toggleLang(){lang=lang==='vi'?'en':'vi';localStorage.setItem('englishQuestLang',lang);render()}
/* ========================= MAP ========================= */
function spawnMonsters(){S.monsters=[['Slime','🟢',45,8,27,34],['Goblin','👹',60,10,57,47],['Bat','🦇',50,9,75,31],['Wolf','🐺',70,12,36,74],['Orc','👺',90,15,77,67]].map(a=>({name:a[0],emoji:a[1],hp:a[2],maxHp:a[2],atk:a[3],x:a[4],y:a[5]}))}
function mapScreen(){if(!S.monsters.length)spawnMonsters();const w=WORLDS.find(x=>x.grade===S.grade);return `<section class="panel"><div class="row"><div><h1 class="title">${w.icon} ${w.name}</h1><span class="badge">Grade ${w.grade}</span></div><button onclick="chooseWorld()">🌎 Change World</button></div><div class="world" id="world"><div class="lake"></div><div class="trees">🌲🌲🌲</div><div class="mountain">⛰️</div><div class="place" style="left:18%;top:82%">🏘️ Village</div><div class="place" style="left:48%;top:18%">🏰 Dungeon</div><div class="place" style="left:82%;top:78%">🏯 Tower</div><div class="place" style="left:79%;top:25%">👑 Boss Arena</div><div class="npc" style="left:25%;top:48%">🦉</div><div class="place" style="left:25%;top:58%">Professor Owl</div><div class="place" style="left:16%;top:18%">📍 START</div><div id="player" class="player" style="left:${S.x}%;top:${S.y}%">🧙</div>${S.monsters.map((m,i)=>`<button class="monster" id="monster-${i}" style="left:${m.x}%;top:${m.y}%" onclick="encounter(${i})" aria-label="${m.name}">${m.emoji}</button>`).join('')}<div class="move-note">⌨️ WASD / Arrow Keys · 📱 Buttons</div><div class="controls"><button class="up" data-dir="up">▲</button><button class="left" data-dir="left">◀</button><button class="down" data-dir="down">▼</button><button class="right" data-dir="right">▶</button></div></div><div class="grid" style="margin-top:11px"><div class="card"><b>🧙 Player</b><p class="muted">Giữ WASD hoặc phím mũi tên để di chuyển. Chạm quái để chiến đấu.</p></div><div class="card"><b>🏰 ${t('dungeon')}</b><p class="muted">5 tầng prototype · boss tầng cuối.</p><button class="primary" onclick="startDungeon()">${t('start')}</button></div><div class="card"><b>🏯 ${t('tower')}</b><p class="muted">5 tầng prototype · có thể mở rộng lên 50.</p><button class="primary" onclick="startTower()">${t('start')}</button></div></div></section>`}
function chooseWorld(){S.grade=null;S.mode='map';save();render()}
/* ========================= MOVEMENT ENGINE =========================
   This is intentionally independent from render(). The old version
   recreated keyboard handlers whenever the UI rendered. This version
   installs exactly one persistent listener and moves the DOM player
   directly, so keyboard input cannot be lost during navigation. */
const held=new Set();const DIR={w:[0,-1],arrowup:[0,-1],s:[0,1],arrowdown:[0,1],a:[-1,0],arrowleft:[-1,0],d:[1,0],arrowright:[1,0]};let last=performance.now(),frame=0;
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(!DIR[k]||S.mode!=='map'||!S.grade)return;e.preventDefault();held.add(k);if(!frame)frame=requestAnimationFrame(loop)});
window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(DIR[k]){e.preventDefault();held.delete(k)}});window.addEventListener('blur',()=>held.clear());
function loop(now){const dt=Math.min(50,now-last);last=now;if(S.mode==='map'&&S.grade&&held.size){let dx=0,dy=0;for(const k of held){dx+=DIR[k][0];dy+=DIR[k][1]}if(dx||dy){const l=Math.hypot(dx,dy)||1;movePlayer(dx/l,dy/l,dt)}frame=requestAnimationFrame(loop)}else frame=0}
function movePlayer(dx,dy,dt){const speed=.025*dt;S.x=Math.max(5,Math.min(94,S.x+dx*speed));S.y=Math.max(7,Math.min(91,S.y+dy*speed));const p=document.getElementById('player');if(p){p.style.left=S.x+'%';p.style.top=S.y+'%';p.classList.add('walk')}checkCollision();save()}
function updatePlayer(){const p=document.getElementById('player');if(p){p.style.left=S.x+'%';p.style.top=S.y+'%'}}
function step(dx,dy){if(S.mode!=='map'||!S.grade)return;S.x=Math.max(5,Math.min(94,S.x+dx*2.8));S.y=Math.max(7,Math.min(91,S.y+dy*2.8));updatePlayer();checkCollision();save()}
function bindTouchControls(){document.querySelectorAll('[data-dir]').forEach(b=>{if(b.dataset.bound)return;b.dataset.bound='1';const d={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[b.dataset.dir];let timer=null;const start=e=>{e.preventDefault();step(...d);timer=setInterval(()=>{if(S.mode==='map')step(...d)},90)};const stop=()=>{if(timer){clearInterval(timer);timer=null}};b.addEventListener('pointerdown',start);b.addEventListener('pointerup',stop);b.addEventListener('pointercancel',stop);b.addEventListener('pointerleave',stop)})}
function checkCollision(){for(let i=0;i<S.monsters.length;i++){const m=S.monsters[i];if(Math.hypot(S.x-m.x,S.y-m.y)<5){encounter(i);return}}}
/* ========================= BATTLE ========================= */
function encounter(i){const m=S.monsters[i];if(!m)return;S.battle={monster:m,index:i,question:null,combo:0,answered:false,dungeon:false};S.mode='battle';save();render()}
function pickQuestion(){const pool=QUESTIONS.filter(q=>q.grade===S.grade);const recent=new Set(S.history.slice(-25).map(x=>x.id));const weak=pool.filter(q=>S.mistakes[q.id]&&S.mistakes[q.id].count>=2);let c=(weak.length&&Math.random()<.45?weak:pool).filter(q=>!recent.has(q.id));if(!c.length)c=weak.length?weak:pool;return c[Math.floor(Math.random()*c.length)]}
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function battleScreen(){const b=S.battle;if(!b.question)b.question=pickQuestion();const q=b.question,m=b.monster;return `<section class="panel"><div class="row"><button onclick="leaveBattle()">← ${t('back')}</button><span class="badge">${q.skill} · ${'⭐'.repeat(q.difficulty)} · ${q.id}</span></div><div class="battle" style="margin-top:12px"><div class="fighter"><div class="avatar">${m.emoji}</div><h3>${esc(m.name)}</h3><div class="bar"><i style="width:${Math.max(0,m.hp/m.maxHp*100)}%"></i></div><small>${m.hp}/${m.maxHp} HP</small></div><div class="question"><h2>${esc(q.question)}</h2>${questionInput(q)}<div id="feedback"></div></div><div class="fighter"><div class="avatar">🧙</div><h3>Player</h3><p>❤️ ${S.hp}/${S.maxHp}</p><p>⚔️ ${S.atk} · 🛡️ ${S.def}</p><p>🔥 Combo ${b.combo}</p></div></div></section>`}
function questionInput(q){if(q.type==='fill'||q.type==='arrange')return `<input id="answer" class="answer" autocomplete="off" placeholder="${q.type==='arrange'?'Type the complete sentence':'Your answer'}" onkeydown="if(event.key==='Enter')submitAnswer(this.value)"><button class="primary" style="margin-top:9px" onclick="submitAnswer(document.getElementById('answer').value)">⚔️ ${t('attack')}</button>`;return `<div class="options">${q.options.map(o=>`<button onclick="submitAnswer(${JSON.stringify(o)})">${esc(o)}</button>`).join('')}</div><div class="row" style="margin-top:10px"><button onclick="useHint()">💡 ${t('hint')} (${S.inventory.hint})</button><button onclick="skipQuestion()">⏭️ ${t('skip')} (${S.inventory.skip})</button></div>`}
function norm(s){return String(s??'').trim().toLowerCase().replace(/[.!?]+$/,'').replace(/\s+/g,' ')}
function submitAnswer(value){if(!S.battle||S.battle.answered)return;const b=S.battle,q=b.question,ok=norm(value)===norm(q.correctAnswer);b.answered=true;S.history.push({id:q.id,correct:ok,time:Date.now()});if(S.history.length>400)S.history.shift();if(!ok){const z=S.mistakes[q.id]||{count:0,correct:0};z.count++;z.last=Date.now();S.mistakes[q.id]=z;b.combo=0;const damage=Math.max(4,Math.round((b.monster.atk||8)-S.def*.25));S.hp=Math.max(1,S.hp-damage);showFeedback(false,q,damage)}else{if(S.mistakes[q.id])S.mistakes[q.id].correct=(S.mistakes[q.id].correct||0)+1;b.combo++;const damage=S.atk+b.combo*2;b.monster.hp=Math.max(0,b.monster.hp-damage);gainXP(18+q.difficulty*6);S.gold+=10;showFeedback(true,q,damage);if(b.monster.hp<=0){finishBattle();return}}save()}
function showFeedback(ok,q,n){const e=document.getElementById('feedback');if(!e)return;e.className='feedback '+(ok?'good':'bad');e.innerHTML=`<b>${ok?'✅ '+t('correct'):'❌ '+t('wrong')}</b><p>${ok?'⚔️ Damage: -'+n+' HP':'💥 Monster attack: -'+n+' HP'}</p>${ok?'':`<p>✅ <b>Correct:</b> ${esc(q.correctAnswer)}</p>`}<p>📚 <b>Why?</b> ${esc(q.explanation)}</p><button class="primary" onclick="continueBattle()">Continue</button>`}
function continueBattle(){if(S.battle&&S.battle.monster.hp<=0){finishBattle();return}if(S.battle){S.battle.question=null;S.battle.answered=false;save();render()}}
function finishBattle(){const b=S.battle;if(!b)return;if(b.dungeon){const boss=S.floor===5;if(boss){S.bosses++;S.gold+=100;S.equipment.push('Knowledge Relic');S.battle=null;S.mode='map';toast('👑 BOSS DEFEATED! +100 Gold');save();render()}else{S.floor++;S.gold+=25;S.battle=null;S.mode='dungeon';toast('🏆 Floor cleared!');save();render()}return}S.kills++;S.streak++;S.gold+=15;S.monsters.splice(b.index,1);S.battle=null;S.mode='map';toast('🏆 Victory! +EXP +Gold');save();render()}
function leaveBattle(){S.battle=null;S.mode='map';save();render()}function useHint(){if(S.inventory.hint<=0)return toast('💡 No hints');S.inventory.hint--;const q=S.battle.question,e=document.getElementById('feedback');e.className='feedback';e.innerHTML=q.type==='mc'?`💡 Hint: loại ${q.options.filter(x=>x!==q.correctAnswer).slice(0,2).map(esc).join(' / ')}.`:`💡 Hint: ${esc(q.explanation)}`;save()}function skipQuestion(){if(S.inventory.skip<=0)return toast('⏭️ No skip tickets');S.inventory.skip--;S.battle.question=null;S.battle.answered=false;save();render()}
/* ========================= BAG / SHOP / REVIEW ========================= */
function bagScreen(){return `<section class="panel"><h2>🎒 ${t('bag')}</h2><div class="grid">${[['potion','❤️ Health Potion'],['mana','⚡ Mana Potion'],['hint','💡 Hint'],['skip','⏭️ Skip Ticket'],['shield','🛡️ Shield']].map(x=>`<div class="card"><b>${x[1]}</b><h2>${S.inventory[x[0]]||0}</h2>${x[0]==='potion'?'<button onclick="usePotion()">Use</button>':''}</div>`).join('')}</div><h3>⚔️ Equipment</h3><div class="grid">${S.equipment.map(x=>`<div class="card">✨ ${esc(x)}</div>`).join('')}</div></section>`}
function usePotion(){if(S.inventory.potion>0&&S.hp<S.maxHp){S.inventory.potion--;S.hp=Math.min(S.maxHp,S.hp+40);save();render()}else toast('❤️ HP is already full')}
function shopScreen(){const items=[['potion','❤️ Health Potion',35],['mana','⚡ Mana Potion',35],['hint','💡 Hint',45],['skip','⏭️ Skip Ticket',70],['shield','🛡️ Shield',80]];return `<section class="panel"><div class="row"><h2>🏪 ${t('shop')}</h2><b>💰 ${S.gold}</b></div><div class="grid">${items.map(x=>`<div class="card row"><b>${x[1]}</b><button onclick="buy('${x[0]}',${x[2]})">${x[2]} 💰</button></div>`).join('')}</div></section>`}
function buy(k,c){if(S.gold<c)return toast('💰 Not enough gold');S.gold-=c;S.inventory[k]++;save();render()}
function mistakesScreen(){const a=Object.entries(S.mistakes).sort((x,y)=>y[1].count-x[1].count);return `<section class="panel"><h2>📖 ${t('mistakes')}</h2><p class="muted">Các câu sai nhiều được ưu tiên trong những trận sau.</p>${a.length?a.map(([id,v])=>{const q=QUESTIONS.find(x=>x.id===id);return `<div class="review"><b>${esc(q?.question||id)}</b><p class="small">❌ ${v.count} · ✅ ${v.correct||0} · ${esc(q?.topic||'')}</p><p class="small">Correct: <b>${esc(q?.correctAnswer||'')}</b><br>${esc(q?.explanation||'')}</p><button onclick="practice('${id}')">${t('practice')}</button></div>`}).join(''):'<div class="card">🎉 Chưa có lỗi.</div>'}</section>`}
function practice(id){const q=QUESTIONS.find(x=>x.id===id);if(!q)return;S.battle={monster:{name:'Review',emoji:'📚',hp:35,maxHp:35,atk:0},index:-1,question:q,combo:0,answered:false,dungeon:false};S.mode='battle';save();render()}
function profileScreen(){const total=S.history.length,correct=S.history.filter(x=>x.correct).length,acc=total?Math.round(correct/total*100):0;return `<section class="panel"><h2>👤 Profile</h2><div class="grid"><div class="card"><div style="font-size:64px">🧙</div><h2>Level ${S.level}</h2><div class="progress"><i style="width:${S.exp/needXP()*100}%"></i></div><p>${S.exp}/${needXP()} EXP</p></div><div class="card"><b>⚔️ Combat</b><p>❤️ ${S.hp}/${S.maxHp}</p><p>⚔️ ATK ${S.atk} · 🛡️ DEF ${S.def}</p><p>👹 Monsters: ${S.kills}</p><p>👑 Bosses: ${S.bosses}</p></div><div class="card"><b>📊 Learning</b><p>Questions: ${total}</p><p>Accuracy: <b>${acc}%</b></p><p>🔥 Streak: ${S.streak}</p><p>📚 Bank: ${QUESTIONS.length.toLocaleString()}</p></div></div></section>`}
/* ========================= DUNGEON / TOWER ========================= */
function startDungeon(){S.mode='dungeon';S.floor=1;S.tower=false;save();render()}function startTower(){S.mode='dungeon';S.floor=1;S.tower=true;save();render()}
function dungeonScreen(){const boss=S.floor===5;return `<section class="panel"><div class="row"><h2>${S.tower?'🏯 Tower of Knowledge':'🏰 Dungeon'} · Floor ${S.floor}/5</h2><button onclick="setMode('map')">← ${t('back')}</button></div><div class="card" style="text-align:center;padding:36px"><div style="font-size:80px">${boss?(S.tower?'🧿':'🐲'):'👺'}</div><h2>${boss?'👑 BOSS':'Elite Monster'}</h2><p class="muted">${boss?'Final floor: harder questions and bigger rewards.':'Questions become harder as you advance.'}</p><button class="primary" onclick="floorFight()">⚔️ Enter</button></div></section>`}
function floorFight(){const boss=S.floor===5;S.battle={monster:{name:boss?'World Boss':'Elite '+(S.tower?'Mage':'Orc'),emoji:boss?(S.tower?'🧿':'🐲'):'👺',hp:boss?160:90,maxHp:boss?160:90,atk:boss?20:13},index:-1,question:null,combo:0,answered:false,dungeon:true};S.mode='battle';save();render()}
/* Start clean if old saved data has impossible coordinates. */
if(!Number.isFinite(S.x)||S.x<0||S.x>100)S.x=50;if(!Number.isFinite(S.y)||S.y<0||S.y>100)S.y=65;if(S.grade&&!S.monsters.length)spawnMonsters();
render();
</script></body></html>
