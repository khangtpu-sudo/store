<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>English Quest // Neon Frontier</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050711;color:#eafaff;font-family:Arial,sans-serif}button,input{font:inherit}button{cursor:pointer;color:#eafaff;background:#10192b;border:1px solid #30445f;border-radius:7px;padding:11px 14px;font-weight:700}button:hover{border-color:#00f0ff;box-shadow:0 0 15px #00f0ff44}button:disabled{opacity:.45;cursor:not-allowed}.app{max-width:1400px;margin:auto;padding:12px}.hud{display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:#080d18;border:1px solid #263955;border-top:2px solid #00f0ff;padding:12px;position:sticky;top:0;z-index:100}.logo{font-weight:900;font-size:21px;letter-spacing:2px}.cyan{color:#00f0ff}.pink{color:#ff25d6}.yellow{color:#ffe600}.hudstats{display:flex;gap:8px;flex:1;justify-content:center;flex-wrap:wrap}.stat{background:#101a2c;padding:7px 10px;border:1px solid #273a56;border-radius:5px}.panel{margin-top:12px;background:linear-gradient(145deg,#0d1525,#060a12);border:1px solid #263955;padding:18px;min-height:250px}.title{font-size:27px;margin:0 0 8px}.muted{color:#8393ad}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{padding:16px;background:#101a2d;border:1px solid #2b405e;border-radius:8px}.nav{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.nav .active{border-color:#00f0ff;color:#00f0ff}.world{height:620px;position:relative;overflow:hidden;border:2px solid #185e70;background:radial-gradient(circle at 55% 30%,#123b4c,#08151f 48%,#04070d);touch-action:none}.world:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#00f0ff0b 1px,transparent 1px),linear-gradient(90deg,#00f0ff0b 1px,transparent 1px);background-size:40px 40px}.building{position:absolute;bottom:0;background:#0c1422;border:1px solid #29445c}.road{position:absolute;height:8px;background:#00f0ff55;box-shadow:0 0 15px #00f0ff}.place{position:absolute;z-index:4;padding:7px;background:#050a13dd;border:1px solid #3b5877;font-size:12px}.player{position:absolute;z-index:20;width:50px;height:60px;display:grid;place-items:center;font-size:39px;user-select:none;filter:drop-shadow(0 0 12px #00f0ff)}.player.walk{animation:bob .12s infinite alternate}@keyframes bob{to{transform:translateY(-4px)}}.monster{position:absolute;z-index:15;width:58px;height:58px;padding:0;border-radius:50%;font-size:30px;background:#281027;border:1px solid #ff25d6;box-shadow:0 0 20px #ff25d644}.npc{position:absolute;z-index:10;font-size:34px}.controls{position:absolute;z-index:30;right:14px;bottom:14px;display:grid;grid-template-columns:58px 58px 58px;gap:6px}.controls button{height:54px;padding:0;font-size:20px}.up{grid-column:2}.left{grid-column:1}.down{grid-column:2}.right{grid-column:3}.battle{display:grid;grid-template-columns:230px 1fr 230px;gap:14px}.fighter{background:#09101d;border:1px solid #30445f;padding:16px;text-align:center}.enemy{border-color:#ff25d6}.hero{border-color:#00f0ff}.avatar{font-size:75px}.bigbar{height:13px;background:#202a3a;margin:9px 0}.bigbar span{display:block;height:100%;transition:.25s}.enemy .bigbar span{background:#ff25d6}.hero .bigbar span{background:#00f0ff}.question{background:#070c16;border:1px solid #30445f;padding:20px;min-height:390px}.qmeta{font-size:11px;color:#00f0ff;letter-spacing:1px}.qtext{font-size:26px;font-weight:800;line-height:1.4;margin:20px 0}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}.option{text-align:left;min-height:58px;border-left:3px solid #00f0ff}.option.correct{background:#0c3827;border-color:#42ff9b}.option.wrong{background:#3a1420;border-color:#ff4568}.answerbox{width:100%;padding:13px;background:#050913;border:1px solid #405172;color:white;outline:none}.answerbox:focus{border-color:#00f0ff}.feedback{margin-top:15px;padding:13px;border:1px solid #405172;background:#10192b}.good{border-color:#42ff9b}.bad{border-color:#ff4568}.toast{position:fixed;right:18px;bottom:18px;background:#081321;border:1px solid #00f0ff;padding:13px 16px;z-index:999;box-shadow:0 0 20px #00f0ff55}.review{padding:13px;margin:8px 0;background:#10192a;border-left:3px solid #ff4568}.small{font-size:13px}@media(max-width:850px){.battle{grid-template-columns:1fr}.options{grid-template-columns:1fr}.world{height:68vh;min-height:500px}.qtext{font-size:21px}}
</style>
</head>
<body>
<div id="app" class="app"></div><div id="toast" class="toast" style="display:none"></div>
<script>
'use strict';
const WORLDS=[
 {grade:6,name:'Green Valley',icon:'🌿',topics:['Family','School','Friends','Animals','Food','Hobbies']},
 {grade:7,name:'Crystal Forest',icon:'💎',topics:['Health','Environment','Travel','Community','Communication']},
 {grade:8,name:'Mystic Kingdom',icon:'🔮',topics:['Science','Technology','Culture','Environment']},
 {grade:9,name:'Dragon Valley',icon:'🐉',topics:['Grammar','Reading','Vocabulary','Communication']},
 {grade:10,name:'Ancient Academy',icon:'🏛️',topics:['Grammar','Reading','Vocabulary']},
 {grade:11,name:'Shadow Empire',icon:'🌑',topics:['Reading','Grammar','Vocabulary']},
 {grade:12,name:'Final Kingdom',icon:'⚡',topics:['Exam Grammar','Reading','Vocabulary']}
];
const VERBS=[['play','plays','played'],['watch','watches','watched'],['study','studies','studied'],['wash','washes','washed'],['visit','visits','visited'],['carry','carries','carried'],['go','goes','went'],['have','has','had'],['do','does','did'],['try','tries','tried'],['read','reads','read'],['make','makes','made']];
const OBJECTS=['football','English','books','music','chess','the piano','cartoons','computer games','science','breakfast','homework','stories'];
const WORDS=[['library','thư viện'],['hospital','bệnh viện'],['forest','khu rừng'],['journey','hành trình'],['healthy','khỏe mạnh'],['pollution','ô nhiễm'],['recycle','tái chế'],['festival','lễ hội'],['neighbor','hàng xóm'],['environment','môi trường'],['technology','công nghệ'],['community','cộng đồng'],['adventure','cuộc phiêu lưu'],['equipment','trang thiết bị'],['protect','bảo vệ'],['discover','khám phá'],['dangerous','nguy hiểm'],['ancient','cổ đại'],['culture','văn hóa'],['communication','giao tiếp']];
const BANK=[];let nextId=1;
function addQuestion(q){BANK.push(Object.assign({id:'Q'+String(nextId++).padStart(5,'0')},q));}
for(const w of WORLDS){for(let i=0;i<500;i++){const topic=w.topics[i%w.topics.length];const difficulty=Math.min(5,1+Math.floor(i/100));const v=VERBS[i%VERBS.length];const obj=OBJECTS[i%OBJECTS.length];
 if(i%4===0){const subject=i%3===0?'She':i%3===1?'He':'They';const answer=subject==='They'?v[0]:v[1];addQuestion({grade:w.grade,world:w.name,topic,skill:'Grammar',difficulty,type:'mc',question:subject+' ___ '+obj+' every day.',options:[answer,subject==='They'?v[1]:v[0],v[2],'going'],correct:answer,explanation:subject==='They'?'They dùng động từ nguyên mẫu.':'He/She + V(s/es) ở hiện tại đơn.'});}
 else if(i%4===1){const x=WORDS[i%WORDS.length];addQuestion({grade:w.grade,world:w.name,topic,skill:'Vocabulary',difficulty,type:'mc',question:'Which word means “'+x[1]+'”?',options:[x[0],'window','station','garden'],correct:x[0],explanation:x[0]+' = '+x[1]+'.'});}
 else if(i%4===2){addQuestion({grade:w.grade,world:w.name,topic,skill:'Grammar',difficulty,type:'fill',question:'Yesterday, I ___ '+obj+'.',options:[],correct:v[2],explanation:'“Yesterday” báo hiệu quá khứ đơn: '+v[0]+' → '+v[2]+'.'});}
 else{const subject=i%2?'I':'My friend';const verb=subject==='I'?v[0]:v[1];addQuestion({grade:w.grade,world:w.name,topic,skill:'Sentence Arrangement',difficulty,type:'arrange',question:'Arrange: '+verb+' / '+obj+' / '+subject,options:[],correct:subject+' '+verb+' '+obj+'.',explanation:'Trật tự cơ bản: Subject + Verb + Object.'});}
}}
const DEFAULT={grade:null,level:1,exp:0,gold:150,hp:100,maxHp:100,mana:80,maxMana:80,atk:10,def:5,streak:0,x:50,y:60,mode:'map',history:[],mistakes:{},inventory:{potion:2,hint:3,skip:1,shield:1},equipment:['NOVICE BLADE'],kills:0,bosses:0,monsters:[],battle:null,floor:0,tower:false};
let S=DEFAULT;try{const old=JSON.parse(localStorage.getItem('englishQuestSave')||'null');if(old)S=Object.assign({},DEFAULT,old,{inventory:Object.assign({},DEFAULT.inventory,old.inventory||{})});}catch(e){S=DEFAULT;}
let lang=localStorage.getItem('englishQuestLang')||'vi';
const UI={vi:{map:'Bản đồ',bag:'Túi đồ',shop:'Cửa hàng',mistakes:'Sổ lỗi',profile:'Hồ sơ',choose:'Chọn lớp',hint:'Gợi ý',skip:'Bỏ qua',attack:'TẤN CÔNG',next:'Tiếp tục',back:'Quay lại'},en:{map:'Map',bag:'Inventory',shop:'Shop',mistakes:'Mistake Book',profile:'Profile',choose:'Choose Grade',hint:'Hint',skip:'Skip',attack:'ATTACK',next:'Continue',back:'Back'}};
const t=k=>UI[lang][k]||k;
function save(){localStorage.setItem('englishQuestSave',JSON.stringify(S));}
function need(){return 120+(S.level-1)*90;}
function gainXP(n){S.exp+=n;while(S.exp>=need()){S.exp-=need();S.level++;S.maxHp+=10;S.maxMana+=5;S.atk+=2;S.def++;S.hp=S.maxHp;toast('✨ LEVEL UP // '+S.level);}save();}
function toast(msg){const e=document.getElementById('toast');e.textContent=msg;e.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>e.style.display='none',1700);}
function header(){return '<header class="hud"><div class="logo">ENGLISH <span class="cyan">QUEST</span><div class="muted" style="font-size:9px">NEON FRONTIER // ONLINE</div></div><div class="hudstats"><span class="stat">❤️ '+S.hp+'/'+S.maxHp+'</span><span class="stat">⚡ '+S.mana+'/'+S.maxMana+'</span><span class="stat">⭐ LV '+S.level+' · '+S.exp+'/'+need()+' XP</span><span class="stat yellow">₡ '+S.gold+'</span><span class="stat">🔥 '+S.streak+'</span></div></header>';}
function nav(){return '<nav class="nav">'+[['map','🗺️ '+t('map')],['bag','🎒 '+t('bag')],['shop','🏪 '+t('shop')],['mistakes','📖 '+t('mistakes')],['profile','👤 '+t('profile')]].map(a=>'<button class="'+(S.mode===a[0]?'active':'')+'" data-nav="'+a[0]+'">'+a[1]+'</button>').join('')+'<button data-action="lang">🌐 '+(lang==='vi'?'EN':'VI')+'</button></nav>';}
function choose(){return '<section class="panel"><h1 class="title">NEON FRONTIER // '+t('choose')+'</h1><p class="muted">Question Engine: <b>'+BANK.length.toLocaleString()+'</b> câu · 500 câu mỗi lớp.</p><div class="grid">'+WORLDS.map(w=>'<button class="card" data-grade="'+w.grade+'"><div style="font-size:48px">'+w.icon+'</div><h2>GRADE '+w.grade+' // '+w.name+'</h2><p class="muted">'+w.topics.join(' · ')+'</p><b class="cyan">500 QUESTIONS</b></button>').join('')+'</div></section>';}
function spawn(){S.monsters=[{name:'Slime',icon:'🟢',hp:45,max:45,atk:7,x:31,y:35},{name:'Goblin',icon:'👹',hp:60,max:60,atk:9,x:62,y:48},{name:'Bat',icon:'🦇',hp:50,max:50,atk:8,x:76,y:28},{name:'Wolf',icon:'🐺',hp:70,max:70,atk:11,x:39,y:73},{name:'Orc',icon:'👺',hp:90,max:90,atk:14,x:78,y:70}];}
function map(){if(!S.monsters.length)spawn();return '<section class="panel"><div class="world" id="world"><div class="road" style="left:10%;top:78%;width:80%"></div><div class="road" style="left:48%;top:20%;height:58px;width:6px"></div><div class="building" style="left:3%;height:90px;width:90px"></div><div class="building" style="left:18%;height:130px;width:70px"></div><div class="building" style="right:4%;height:170px;width:100px"></div><div class="place" style="left:8%;top:10%">🏘️ VILLAGE</div><div class="place" style="left:44%;top:8%">🏰 DUNGEON</div><div class="place" style="right:7%;top:13%">🏯 TOWER</div><div class="place" style="right:8%;top:42%">👑 BOSS ARENA</div><div class="npc" style="left:24%;top:43%">🦉</div><div class="place" style="left:20%;top:51%">Professor Owl</div><div class="place" style="left:3%;top:3%">'+WORLDS[S.grade-6].icon+' '+WORLDS[S.grade-6].name+'</div><div id="player" class="player" style="left:'+S.x+'%;top:'+S.y+'%">🧙</div>'+S.monsters.map((m,i)=>'<button class="monster" data-monster="'+i+'" style="left:'+m.x+'%;top:'+m.y+'%">'+m.icon+'</button>').join('')+'<div class="controls"><button class="up" data-move="up">▲</button><button class="left" data-move="left">◀</button><button class="down" data-move="down">▼</button><button class="right" data-move="right">▶</button></div></div><div class="grid" style="margin-top:12px"><div class="card"><b>🗺️ EXPLORATION</b><p class="muted">Di chuyển bằng WASD hoặc Arrow Keys. Chạm quái để chiến đấu.</p></div><div class="card"><b>🏰 DUNGEON</b><p class="muted">5 tầng prototype · tầng cuối boss.</p><button data-action="dungeon">ENTER DUNGEON</button></div><div class="card"><b>🏯 TOWER</b><p class="muted">5 tầng prototype · có thể mở rộng lên 50.</p><button data-action="tower">ENTER TOWER</button></div></div></section>';}
function chooseQuestion(){const pool=BANK.filter(q=>q.grade===S.grade);const recent=new Set(S.history.slice(-20).map(x=>x.id));let weak=pool.filter(q=>S.mistakes[q.id]&&S.mistakes[q.id].count>=2&&!recent.has(q.id));let candidates=(weak.length&&Math.random()<.5?weak:pool.filter(q=>!recent.has(q.id)));if(!candidates.length)candidates=pool;return candidates[Math.floor(Math.random()*candidates.length)];}
function battle(){if(!S.battle.q)S.battle.q=chooseQuestion();const b=S.battle,q=b.q,m=b.monster;let content='';if(q.type==='mc')content='<div class="options">'+q.options.map((o,i)=>'<button class="option" data-answer="'+encodeURIComponent(o)+'">'+String.fromCharCode(65+i)+'. '+o+'</button>').join('')+'</div>';else content='<input id="answerInput" class="answerbox" placeholder="'+(q.type==='arrange'?'Type the complete sentence':'Your answer')+'"><button class="primary" style="margin-top:10px" data-action="submit-input">⚔️ '+t('attack')+'</button>';return '<section class="panel"><div class="battle"><div class="fighter enemy"><div class="avatar">'+m.icon+'</div><h2>'+m.name+'</h2><div class="bigbar"><span style="width:'+(m.hp/m.max*100)+'%"></span></div><b>'+m.hp+' / '+m.max+' HP</b></div><div class="question"><div class="qmeta">'+q.skill.toUpperCase()+' · '+('⭐'.repeat(q.difficulty))+' · '+q.id+'</div><div class="qtext">'+q.question+'</div>'+content+'<div class="nav"><button data-action="hint">💡 '+t('hint')+' ('+S.inventory.hint+')</button><button data-action="skip">⏭️ '+t('skip')+' ('+S.inventory.skip+')</button><button data-action="leave">'+t('back')+'</button></div><div id="feedback"></div></div><div class="fighter hero"><div class="avatar">🧙</div><h2>PLAYER</h2><div class="bigbar"><span style="width:'+(S.hp/S.maxHp*100)+'%"></span></div><b>❤️ '+S.hp+' / '+S.maxHp+'</b><p>⚔️ ATK '+S.atk+' · 🛡️ DEF '+S.def+'</p><p>🔥 COMBO '+b.combo+'</p></div></div></section>';}
function submitAnswer(value){if(!S.battle||S.battle.locked)return;const q=S.battle.q,m=S.battle.monster;const clean=x=>String(x).trim().toLowerCase().replace(/[.!?]+$/,'');const ok=clean(value)===clean(q.correct);S.battle.locked=true;S.history.push({id:q.id,correct:ok,at:Date.now()});if(S.history.length>300)S.history.shift();if(!ok){const rec=S.mistakes[q.id]||{count:0,correct:0};rec.count++;rec.last=Date.now();S.mistakes[q.id]=rec;S.battle.combo=0;const damage=Math.max(1,m.atk-Math.floor(S.def/3));S.hp=Math.max(1,S.hp-damage);showFeedback(false,q,'-'+damage+' HP');}else{if(S.mistakes[q.id])S.mistakes[q.id].correct=(S.mistakes[q.id].correct||0)+1;S.battle.combo++;const damage=S.atk+S.battle.combo*2;m.hp=Math.max(0,m.hp-damage);S.gold+=10;gainXP(18+q.difficulty*5);showFeedback(true,q,'-'+damage+' ENEMY HP');}save();}
function showFeedback(ok,q,msg){const e=document.getElementById('feedback');if(!e)return;e.className='feedback '+(ok?'good':'bad');e.innerHTML='<b>'+ (ok?'✅ CORRECT // '+msg:'❌ WRONG // '+msg)+'</b><p><b>Correct:</b> '+q.correct+'</p><p>📚 <b>Why?</b> '+q.explanation+'</p><button data-action="continue">'+t('next')+' ▶</button>';document.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;if(b.textContent.includes(q.correct))b.classList.add('correct');});}
function hint(){if(S.inventory.hint<=0){toast('No hints available');return}S.inventory.hint--;const q=S.battle.q;const e=document.getElementById('feedback');if(e)e.innerHTML='<div class="feedback">💡 Hint: '+(q.type==='mc'?'Đáp án không phải là hai lựa chọn cuối.':'Hãy chú ý cấu trúc câu và từ khóa.')+'</div>';save();}
function skip(){if(S.inventory.skip<=0){toast('No skip tickets');return}S.inventory.skip--;S.battle.q=null;S.battle.locked=false;save();render();}
function nextBattle(){if(S.battle.monster.hp<=0){const dead=S.battle.monster;S.kills++;S.streak++;S.gold+=20;if(S.battle.dungeonBoss){S.bosses++;S.floor=0;}S.monsters=S.monsters.filter(m=>m!==dead);S.mode='map';S.battle=null;toast('🏆 '+dead.name+' DEFEATED!');save();render();return}S.battle.q=null;S.battle.locked=false;save();render();}
function bag(){return '<section class="panel"><h1 class="title">🎒 '+t('bag')+'</h1><div class="grid">'+[['potion','❤️ Health Potion'],['hint','💡 Hint'],['skip','⏭️ Skip Ticket'],['shield','🛡️ Shield']].map(x=>'<div class="card"><b>'+x[1]+'</b><div style="font-size:28px;margin:10px 0">'+(S.inventory[x[0]]||0)+'</div>'+(x[0]==='potion'?'<button data-action="potion">USE</button>':'')+'</div>').join('')+'</div><h2>⚔️ Equipment</h2><div class="grid">'+S.equipment.map(x=>'<div class="card">✨ '+x+'</div>').join('')+'</div></section>';}
function shop(){const items=[['potion','❤️ Health Potion',35],['hint','💡 Hint',45],['skip','⏭️ Skip Ticket',70],['shield','🛡️ Shield',80]];return '<section class="panel"><h1 class="title">🏪 SHOP // ₡ '+S.gold+'</h1><div class="grid">'+items.map(x=>'<div class="card"><b>'+x[1]+'</b><p>₡ '+x[2]+'</p><button data-buy="'+x[0]+'" data-price="'+x[2]+'">BUY</button></div>').join('')+'</div></section>';}
function mistakes(){const arr=Object.entries(S.mistakes).sort((a,b)=>b[1].count-a[1].count);return '<section class="panel"><h1 class="title">📖 '+t('mistakes')+'</h1><p class="muted">Các câu sai nhiều được ưu tiên luyện lại.</p>'+(arr.length?arr.map(([id,v])=>{const q=BANK.find(x=>x.id===id);return '<div class="review"><b>'+q.question+'</b><p class="small">❌ Sai '+v.count+' lần · '+q.skill+' · '+q.world+'</p><p class="small">✅ '+q.correct+'<br>📚 '+q.explanation+'</p><button data-practice="'+id+'">PRACTICE</button></div>';}).join(''):'<div class="card">🎉 Chưa có lỗi.</div>')+'</section>';}
function profile(){const total=S.history.length,correct=S.history.filter(x=>x.correct).length,acc=total?Math.round(correct/total*100):0;return '<section class="panel"><h1 class="title">👤 PROFILE</h1><div class="grid"><div class="card"><div style="font-size:65px">🧙</div><h2>LEVEL '+S.level+'</h2><p>XP '+S.exp+' / '+need()+'</p></div><div class="card"><h2>⚔️ COMBAT</h2><p>👹 Monsters: '+S.kills+'</p><p>👑 Bosses: '+S.bosses+'</p><p>🔥 Streak: '+S.streak+'</p></div><div class="card"><h2>📚 LEARNING</h2><p>Questions: '+total+'</p><p>Accuracy: <b>'+acc+'%</b></p><p>Bank: '+BANK.length.toLocaleString()+'</p></div></div></section>';}
function dungeon(){const boss=S.floor===5;return '<section class="panel"><h1 class="title">🏰 DUNGEON // FLOOR '+S.floor+'/5</h1><div class="card" style="text-align:center"><div style="font-size:80px">'+(boss?'👑':'👹')+'</div><h2>'+(boss?'DUNGEON BOSS':'ELITE MONSTER')+'</h2><button data-action="floorfight">⚔️ ENTER</button> <button data-action="leave">'+t('back')+'</button></div></section>';}
function render(){const body=!S.grade?choose():S.mode==='map'?map():S.mode==='battle'?battle():S.mode==='bag'?bag():S.mode==='shop'?shop():S.mode==='mistakes'?mistakes():S.mode==='profile'?profile():S.mode==='dungeon'?dungeon():map();document.getElementById('app').innerHTML=header()+body+nav();updatePlayer();}
function updatePlayer(){const p=document.getElementById('player');if(p){p.style.left=S.x+'%';p.style.top=S.y+'%';}}
function setMode(m){S.mode=m;save();render();}
function move(dx,dy){if(S.mode!=='map'||!S.grade)return;S.x=Math.max(2,Math.min(91,S.x+dx*2.4));S.y=Math.max(2,Math.min(88,S.y+dy*2.4));const p=document.getElementById('player');if(p)p.classList.add('walk');clearTimeout(window.walkTimer);window.walkTimer=setTimeout(()=>{const pp=document.getElementById('player');if(pp)pp.classList.remove('walk')},160);for(let i=0;i<S.monsters.length;i++){const m=S.monsters[i];if(Math.abs(S.x-m.x)<5&&Math.abs(S.y-m.y)<5){encounter(i);break}}save();updatePlayer();}
function encounter(i){const m=S.monsters[i];S.battle={monster:m,q:null,combo:0,locked:false,dungeonBoss:false};S.mode='battle';render();}
function startFloor(){const boss=S.floor===5;const m={name:boss?(S.tower?'TOWER FINAL BOSS':'DUNGEON BOSS'):'Elite '+(S.tower?'Mage':'Orc'),icon:boss?(S.tower?'🧿':'🐲'):'👺',hp:boss?180:90,max:boss?180:90,atk:boss?20:14};S.battle={monster:m,q:null,combo:0,locked:false,dungeonBoss:boss};S.mode='battle';render();}
window.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName)&&e.key!=='Escape')return;const k=e.key.toLowerCase();if(k==='w'||k==='arrowup'){e.preventDefault();move(0,-1)}else if(k==='s'||k==='arrowdown'){e.preventDefault();move(0,1)}else if(k==='a'||k==='arrowleft'){e.preventDefault();move(-1,0)}else if(k==='d'||k==='arrowright'){e.preventDefault();move(1,0)}else if(k==='enter'&&S.mode==='battle'&&document.getElementById('answerInput'))submitAnswer(document.getElementById('answerInput').value);});
let holdTimer=null;
document.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-move]');if(!b)return;const dir=b.dataset.move;const fn=()=>{if(dir==='up')move(0,-1);if(dir==='down')move(0,1);if(dir==='left')move(-1,0);if(dir==='right')move(1,0)};fn();holdTimer=setInterval(fn,90);});
document.addEventListener('pointerup',()=>{clearInterval(holdTimer);holdTimer=null;});
document.addEventListener('pointercancel',()=>{clearInterval(holdTimer);holdTimer=null;});
document.addEventListener('click',e=>{const target=e.target.closest('button');if(!target)return;
 if(target.dataset.grade){S.grade=Number(target.dataset.grade);S.mode='map';S.x=50;S.y=60;S.monsters=[];spawn();save();render();return;}
 if(target.dataset.nav){setMode(target.dataset.nav);return;}
 if(target.dataset.monster){encounter(Number(target.dataset.monster));return;}
 if(target.dataset.answer){submitAnswer(decodeURIComponent(target.dataset.answer));return;}
 if(target.dataset.buy){const key=target.dataset.buy,price=Number(target.dataset.price);if(S.gold<price){toast('Not enough credits');return}S.gold-=price;S.inventory[key]=(S.inventory[key]||0)+1;save();render();return;}
 if(target.dataset.practice){const q=BANK.find(x=>x.id===target.dataset.practice);if(q){S.battle={monster:{name:'REVIEW',icon:'📚',hp:40,max:40,atk:0},q,combo:0,locked:false,dungeonBoss:false};S.mode='battle';render();}return;}
 const a=target.dataset.action;
 if(a==='lang'){lang=lang==='vi'?'en':'vi';localStorage.setItem('englishQuestLang',lang);render();return;}
 if(a==='leave'){S.mode='map';S.battle=null;save();render();return;}
 if(a==='continue'){nextBattle();return;}
 if(a==='submit-input'){submitAnswer(document.getElementById('answerInput')?.value||'');return;}
 if(a==='hint'){hint();return;}
 if(a==='skip'){skip();return;}
 if(a==='potion'){if(S.inventory.potion>0&&S.hp<S.maxHp){S.inventory.potion--;S.hp=Math.min(S.maxHp,S.hp+40);save();render();}return;}
 if(a==='dungeon'){S.floor=1;S.tower=false;S.mode='dungeon';save();render();return;}
 if(a==='tower'){S.floor=1;S.tower=true;S.mode='dungeon';save();render();return;}
 if(a==='floorfight'){startFloor();return;}
});
render();
</script>
</body>
</html>
