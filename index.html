<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap');
:root{--bg:#05070d;--panel:#0c1220;--panel2:#121a2b;--cyan:#00f0ff;--pink:#ff2bd6;--yellow:#ffe600;--green:#42ff9b;--red:#ff4668;--text:#eaf7ff;--muted:#8491ad;--line:#273653}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 5%,#16294a 0,#070a12 42%,#030409 100%);color:var(--text);font-family:Rajdhani,system-ui,sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer;color:var(--text);border:1px solid #334363;background:#111a2d;padding:11px 14px;border-radius:4px;font-weight:700;transition:.15s}button:hover{border-color:var(--cyan);box-shadow:0 0 18px #00f0ff33;transform:translateY(-1px)}button:active{transform:translateY(1px)}button.primary{background:linear-gradient(90deg,#6813b9,#b917a0);border-color:var(--pink)}.app{width:min(1400px,100%);margin:auto;padding:12px}.top{display:grid;grid-template-columns:260px 1fr auto;gap:16px;align-items:center;background:#080c15ee;border:1px solid var(--line);border-top:2px solid var(--cyan);padding:11px 14px;position:sticky;top:0;z-index:50;box-shadow:0 8px 30px #0008}.logo{font-family:Orbitron;font-weight:900;letter-spacing:1px}.logo b{color:var(--cyan)}.scan{font-family:Orbitron;color:var(--cyan);font-size:10px;letter-spacing:2px}.meters{display:grid;grid-template-columns:repeat(4,minmax(90px,1fr));gap:7px}.meter{background:#0b111e;border:1px solid #25314b;padding:5px 8px}.meter small{display:flex;justify-content:space-between;color:var(--muted)}.meter i{display:block;height:5px;background:#202a3d;margin-top:4px}.meter i span{display:block;height:100%;background:var(--cyan)}.meter.hp i span{background:var(--red)}.meter.xp i span{background:var(--yellow)}.credits{font-family:Orbitron;color:var(--yellow)}.nav{display:flex;gap:7px;flex-wrap:wrap;padding:10px 0}.nav button.active{border-color:var(--cyan);background:#102b36;color:var(--cyan)}.panel{background:linear-gradient(145deg,#0e1525,#080d17);border:1px solid var(--line);padding:18px;position:relative;overflow:hidden}.panel:before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 49.7%,#00f0ff06 50%,transparent 50.3%);pointer-events:none}.title{font-family:Orbitron;margin:0 0 8px;letter-spacing:1px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{background:#10192a;border:1px solid #293653;padding:14px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.tag{display:inline-block;padding:4px 8px;border:1px solid #3b4b6c;color:var(--cyan);font-family:Orbitron;font-size:10px;margin:2px}.world{height:620px;position:relative;overflow:hidden;border:2px solid #24495a;background:radial-gradient(circle at 60% 30%,#153a48,#0a1925 45%,#071016);touch-action:none}.world:after{content:'';position:absolute;inset:0;background:linear-gradient(#00f0ff08 1px,transparent 1px),linear-gradient(90deg,#00f0ff08 1px,transparent 1px);background-size:38px 38px;pointer-events:none}.city{position:absolute;bottom:0;left:0;right:0;height:25%;background:repeating-linear-gradient(90deg,#090f1a 0 70px,#182238 70px 75px);border-top:1px solid #24495a}.building{position:absolute;bottom:24%;width:55px;background:#101b2c;border:1px solid #2b4864}.neonline{position:absolute;background:#00f0ff55;box-shadow:0 0 15px #00f0ff88}.place{position:absolute;z-index:4;padding:6px 9px;background:#050a13dd;border:1px solid #35516e;color:#b9dfff;font-size:12px;transform:translate(-50%,-50%)}.npc{position:absolute;z-index:6;width:50px;height:50px;border:1px solid var(--yellow);background:#251f15;box-shadow:0 0 15px #ffe60044;display:flex;align-items:center;justify-content:center;font-size:28px}.monster{position:absolute;z-index:12;width:52px;height:52px;border:1px solid var(--pink);background:#241027;box-shadow:0 0 18px #ff2bd655;display:flex;align-items:center;justify-content:center;font-size:29px;padding:0;border-radius:50%}.monster:hover{box-shadow:0 0 25px #ff2bd6aa}.player{position:absolute;z-index:15;width:50px;height:60px;font-size:42px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 0 10px #00f0ff);transition:left .07s linear,top .07s linear}.player.walk{animation:bob .16s infinite alternate}@keyframes bob{to{transform:translateY(-4px)}}.controls{position:absolute;right:14px;bottom:14px;display:grid;grid-template-columns:55px 55px 55px;gap:6px;z-index:20}.controls button{height:50px;font-size:20px;background:#07101ce8}.controls .up{grid-column:2}.controls .down{grid-column:2}.controls .right{grid-column:3}.controls .left{grid-column:1}.battle{display:grid;grid-template-columns:260px 1fr 260px;gap:14px;align-items:stretch}.fighter{background:#0b1120;border:1px solid #31405f;padding:18px;text-align:center}.fighter.enemy{border-color:var(--pink);box-shadow:inset 0 0 35px #ff2bd60a}.fighter.hero{border-color:var(--cyan)}.avatar{font-size:82px;filter:drop-shadow(0 0 12px #00f0ff44)}.bigbar{height:13px;background:#20283a;margin:10px 0;overflow:hidden}.bigbar span{display:block;height:100%;background:var(--pink);transition:width .3s}.hero .bigbar span{background:var(--cyan)}.question{background:#080d18;border:1px solid #31405f;padding:20px;min-height:360px}.qtext{font-size:25px;font-weight:700;margin:20px 0}.options{display:grid;grid-template-columns:1fr 1fr;gap:9px}.option{min-height:52px;text-align:left;border-left:3px solid var(--cyan)}.option.correct{border-color:var(--green);background:#0e3527}.option.wrong{border-color:var(--red);background:#3b1520}.answerbox{width:100%;padding:13px;background:#050913;border:1px solid #3c4c6d;color:white;outline:none}.answerbox:focus{border-color:var(--cyan);box-shadow:0 0 12px #00f0ff22}.feedback{margin-top:15px;padding:13px;border:1px solid #344565;background:#10192b}.feedback.good{border-color:var(--green)}.feedback.bad{border-color:var(--red)}.review{border-left:3px solid var(--red);padding:12px;background:#11192a;margin:8px 0}.toast{position:fixed;right:18px;bottom:18px;background:#0b1322;border:1px solid var(--cyan);padding:13px 16px;z-index:100;box-shadow:0 0 20px #00f0ff33}.choice{text-align:left;padding:18px}.choice:hover{border-color:var(--pink)}.statbig{font- <body><main id="app" class="app"></main><div id="toast" class="toast" style="display:none"></div>
<script>
'use strict';
const WORLDS=[{g:6,n:'GREEN VALLEY',e:'🌿',topics:['Family','School','Friends','Animals','Food','Hobbies']},{g:7,n:'CRYSTAL FOREST',e:'💎',topics:['Health','Environment','Travel','Community','Communication']},{g:8,n:'MYSTIC KINGDOM',e:'🔮',topics:['Science','Technology','Culture','Environment','Natural disasters']},{g:9,n:'DRAGON VALLEY',e:'🐉',topics:['Grammar','Reading','Vocabulary','Communication']},{g:10,n:'ANCIENT ACADEMY',e:'🏛️',topics:['Grammar','Reading','Vocabulary','Communication']},{g:11,n:'SHADOW EMPIRE',e:'🌑',topics:['Reading','Grammar','Vocabulary','Critical thinking']},{g:12,n:'FINAL KINGDOM',e:'⚡',topics:['Exam grammar','Reading','Vocabulary','Translation']}];
const VERBS=[['play','plays','played'],['watch','watches','watched'],['study','studies','studied'],['wash','washes','washed'],['visit','visits','visited'],['carry','carries','carried'],['go','goes','went'],['have','has','had'],['do','does','did'],['try','tries','tried'],['read','reads','read'],['make','makes','made']];
const WORDS=[['library','thư viện'],['hospital','bệnh viện'],['forest','khu rừng'],['journey','hành trình'],['healthy','khỏe mạnh'],['pollution','ô nhiễm'],['recycle','tái chế'],['festival','lễ hội'],['neighbor','hàng xóm'],['environment','môi trường'],['technology','công nghệ'],['community','cộng đồng'],['adventure','cuộc phiêu lưu'],['equipment','trang thiết bị'],['protect','bảo vệ'],['discover','khám phá'],['dangerous','nguy hiểm'],['ancient','cổ đại'],['culture','văn hóa'],['communication','giao tiếp']];
const OBJECTS=['football','English','books','music','chess','the piano','cartoons','computer games','science','breakfast','homework','stories'];const BANK=[];let qid=0;function add(q){BANK.push({id:'Q'+String(++qid).padStart(5,'0'),...q})}
for(const w of WORLDS){for(let i=0;i<500;i++){const topic=w.topics[i%w.topics.length],d=Math.min(5,1+Math.floor(i/100)),v=VERBS[i%VERBS.length],obj=OBJECTS[i%OBJECTS.length];if(i%4===0){const sub=i%3===1?'They':i%3===2?'He':'She',a=sub==='They'?v[0]:v[1];add({grade:w.g,world:w.n,topic,skill:'Grammar',difficulty:d,type:'mc',q:`${sub} ___ ${obj} every day.`,o:[a,sub==='They'?v[1]:v[0],v[2],'going'],a,e:sub==='They'?'They dùng động từ nguyên mẫu ở hiện tại đơn.':'He/She + V(s/es) ở hiện tại đơn.'})}else if(i%4===1){const x=WORDS[i%WORDS.length];add({grade:w.g,world:w.n,topic,skill:'Vocabulary',difficulty:d,type:'mc',q:`Which word means “${x[1]}”?`,o:[x[0],'window','station','garden'],a:x[0],e:`${x[0]} = ${x[1]}.`})}else if(i%4===2){add({grade:w.g,world:w.n,topic,skill:'Grammar',difficulty:d,type:'fill',q:`Yesterday, I ___ ${obj}.`,o:[],a:v[2],e:`“Yesterday” báo hiệu quá khứ đơn: ${v[0]} → ${v[2]}.`})}else{const sub=i%2?'I':'My friend',verb=sub==='I'?v[0]:v[1];add({grade:w.g,world:w.n,topic,skill:'Sentence arrangement',difficulty:d,type:'arrange',q:`Arrange: ${verb} / ${obj} / ${sub}.`,o:[],a:`${sub} ${verb} ${obj}.`,e:'Trật tự cơ bản: Subject + Verb + Object.'})}}}
const DEFAULT={grade:null,level:1,exp:0,gold:150,hp:100,maxHp:100,mana:80,maxMana:80,atk:10,def:5,streak:0,x:50,y:65,mode:'map',monsters:[],history:[],mistakes:{},inventory:{potion:2,hint:3,skip:1,shield:1},equipment:['NOVICE BLADE'],kills:0,bosses:0,floor:0,tower:false,battle:null};let old={};try{old=JSON.parse(localStorage.getItem('englishQuestSave')||'{}')||{}}catch(e){}const S=Object.assign({},DEFAULT,old);S.inventory=Object.assign({},DEFAULT.inventory,old.inventory||{});S.history=Array.isArray(old.history)?old.history:[];S.mistakes=old.mistakes||{};let lang=localStorage.getItem('englishQuestLang')||'vi';
const UI={vi:{map:'Bản đồ',bag:'Túi đồ',shop:'Cửa hàng',mistakes:'Sổ lỗi',profile:'Hồ sơ',choose:'Chọn lớp',hint:'Gợi ý',skip:'Bỏ qua',practice:'Luyện lại',correct:'CHÍNH XÁC',wrong:'SAI RỒI',attack:'TẤN CÔNG',next:'Tiếp tục'},en:{map:'Map',bag:'Inventory',shop:'Shop',mistakes:'Mistake Book',profile:'Profile',choose:'Choose Grade',hint:'Hint',skip:'Skip',practice:'Practice',correct:'CORRECT',wrong:'WRONG',attack:'ATTACK',next:'Continue'}};const t=k=>UI[lang][k]||k;
function save(){localStorage.setItem('englishQuestSave',JSON.stringify(S))}function toast(x){const e=document.getElementById('toast');e.textContent=x;e.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.display='none',1700)}function need(){return 120+(S.level-1)*90}function xp(n){S.exp+=n;while(S.exp>=need()){S.exp-=need();S.level++;S.maxHp+=10;S.maxMana+=5;S.atk+=2;S.def++;S.hp=S.maxHp;toast('LEVEL UP // '+S.level)}save()}
function header(){return `<header class="top"><div class="logo">ENGLISH <b>QUEST</b><div class="scan">NEON FRONTIER // ONLINE</div></div><div class="meters"><div class="meter hp"><small>HP <span>${S.hp}/${S.maxHp}</span></small><i><span style="width:${S.hp/S.maxHp*100}%"></span></i></div><div class="meter"><small>MANA <span>${S.mana}/${S.maxMana}</span></small><i><span style="width:${S.mana/S.maxMana*100}%"></span></i></div><div class="meter xp"><small>LV ${S.level} <span>${S.exp}/${need()}</span></small><i><span style="width:${S.exp/need()*100}%"></span></i></div><div class="meter"><small>STREAK <span>🔥${S.streak}</span></small><i><span style="width:${Math.min(100,S.streak*5)}%"></span></i></div></div><div class="credits">¢ ${S.gold}</div></header>`}
function nav(){return `<nav class="nav">${[['map','🗺️ '+t('map')],['bag','🎒 '+t('bag')],['shop','🏪 '+t('shop')],['mistakes','📖 '+t('mistakes')],['profile','👤 '+t('profile')]].map(([m,n])=>`<button class="${S.mode===m?'active':''}" data-nav="${m}">${n}</button>`).join('')}<button data-lang>🌐 ${lang==='vi'?'EN':'VI'}</button></nav>`}
function render(){document.getElementById('app').innerHTML=header()+view()+nav();bindUI();if(S.mode==='map')updatePlayer()}
function view(){if(!S.grade)return choose();if(S.mode==='map')return map();if(S.mode==='battle')return battle();if(S.mode==='bag')return bag();if(S.mode==='shop')return shop();if(S.mode==='mistakes')return mistakes();if(S.mode==='profile')return profile();if(S.mode==='dungeon')return dungeon();return map()}
function choose(){return `<section class="panel"><h1 class="title">// ${t('choose')}</h1><p class="muted">Question Engine // <b>${BANK.length.toLocaleString()}</b> questions // 500 per grade</p><div class="grid">${WORLDS.map(w=>`<button class="card choice" data-grade="${w.g}"><div style="font-size:48px">${w.e}</div><h2>${w.n}</h2><p>GRADE ${w.g}</p><span class="tag">500 QUESTIONS</span><p class="muted">${w.topics.join(' · ')}</p></button>`).join('')}</div></section>`}
function chooseGrade(g){S.grade=g;S.mode='map';S.x=50;S.y=65;S.hp=S.maxHp;spawn();save();render()}
function spawn(){S.monsters=[['SLIME','🟢',45,8,28,35],['GOBLIN','👹',60,10,58,47],['CYBER BAT','🦇',50,9,75,30],['WOLF','🐺',70,12,37,73],['ORC','👺',90,15,78,67]].map(a=>({name:a[0],emoji:a[1],hp:a[2],max:a[2],atk:a[3],x:a[4],y:a[5]}))}
function map(){if(!S.monsters.length)spawn();const w=WORLDS.find(x=>x.g===S.grade);return `<section class="panel"><div class="row"><div><div class="scan">SECTOR ${String(S.grade).padStart(2,'0')} // ACTIVE</div><h1 class="title">${w.e} ${w.n}</h1></div><div><span class="tag">WASD</span><span class="tag">ARROWS</span><span class="tag">TOUCH</span></div></div><div class="world" id="world"><div class="city"></div><div class="building" style="left:9%;height:120px"></div><div class="building" style="left:15%;height:180px"></div><div class="building" style="left:72%;height:150px"></div><div class="building" style="left:80%;height:210px"></div><div class="neonline" style="width:35%;height:2px;left:20%;top:58%"></div><div class="place" style="left:17%;top:78%">🏙️ VILLAGE</div><div class="place" style="left:47%;top:18%">🏰 DUNGEON</div><div class="place" style="left:83%;top:78%">🏯 TOWER</div><div class="place" style="left:80%;top:25%">👑 BOSS ARENA</div><div class="npc" style="left:24%;top:48%">🦉</div><div class="place" style="left:24%;top:57%">PROFESSOR OWL</div><div class="place" style="left:15%;top:18%">WORLD // ${w.g}</div><div id="player" class="player" style="left:${S.x}%;top:${S.y}%">🧙</div>${S.monsters.map((m,i)=>`<button class="monster" style="left:${m.x}%;top:${m.y}%" data-monster="${i}">${m.emoji}</button>`).join('')}<div class="controls"><button data-move="0,-1" class="up">▲</button><button data-move="-1,0" class="left">◀</button><button data-move="0,1" class="down">▼</button><button data-move="1,0" class="right">▶</button></div></div><div class="grid" style="margin-top:12px"><div class="card"><b>🧭 EXPLORATION</b><p class="muted">Di chuyển bằng WASD, Arrow Keys hoặc giữ nút cảm ứng. Chạm quái để chiến đấu.</p></div><div class="card"><b>🏰 DUNGEON</b><p class="muted">5 tầng prototype · câu hỏi khó dần.</p><button data-dungeon>ENTER DUNGEON</button></div><div class="card"><b>🏯 TOWER</b><p class="muted">5 tầng prototype · boss ở tầng cuối.</p><button data-tower>ENTER TOWER</button></div></div></section>`}
function pick(){const pool=BANK.filter(q=>q.grade===S.grade);const recent=new Set(S.history.slice(-25).map(x=>x.id));const weak=pool.filter(q=>S.mistakes[q.id]?.count>=2);let c=(weak.length&&Math.random()<.45?weak:pool).filter(q=>!recent.has(q.id));if(!c.length)c=pool;S.battle.q=c[Math.floor(Math.random()*c.length)]}
function battle(){if(!S.battle.q)pick();const b=S.battle,q=b.q,m=b.m;return `<section class="panel"><div class="row"><div><div class="scan">COMBAT LINK // ${q.skill.toUpperCase()}</div><h1 class="title">${b.dungeonBoss?'⚠️ BOSS ENCOUNTER':'⚔️ ENCOUNTER'}</h1></div><span class="tag">${q.id} · ${'★'.repeat(q.difficulty)}</span></div><div class="battle"><div class="fighter enemy"><div class="avatar">${m.emoji}</div><h2>${m.name}</h2><div class="bigbar"><span style="width:${Math.max(0,m.hp/m.max*100)}%"></span></div><b>${m.hp}/${m.max} HP</b><p class="muted">ATK ${m.atk}</p></div><div class="question"><span class="tag">${q.topic}</span><span class="tag">${q.type.toUpperCase()}</span><div class="qtext">${q.q}</div>${input(q)}<div id="feedback"></div></div><div class="fighter hero"><div class="avatar">🧙</div><h2>PLAYER</h2><div class="bigbar"><span style="width:${S.hp/S.maxHp*100}%"></span></div><b>${S.hp}/${S.maxHp} HP</b><p>⚔️ ATK ${S.atk} · 🛡️ DEF ${S.def}</p><p>🔥 COMBO ${b.combo}</p></div></div></section>`}
function input(q){if(q.type==='mc')return `<div class="options">${q.o.map((x,i)=>`<button class="option" data-answer="${encodeURIComponent(x)}"><b>${String.fromCharCode(65+i)}.</b> ${x}</button>`).join('')}</div><div style="margin-top:10px;display:flex;gap:7px"><button data-hint>💡 ${t('hint')} (${S.inventory.hint})</button><button data-skip>⏭️ ${t('skip')} (${S.inventory.skip})</button></div>`;return `<input class="answerbox" id="answer" autocomplete="off" placeholder="${q.type==='arrange'?'Type the complete sentence':'Type your answer'}"><button class="primary" style="margin-top:10px;width:100%" data-text-answer>⚔️ ${t('attack')}</button>`}
function answer(value){if(!S.battle||S.battle.locked)return;const b=S.battle,q=b.q,n=x=>String(x).trim().toLowerCase().replace(/[.!?]+$/,'').replace(/\s+/g,' '),ok=n(value)===n(q.a);S.history.push({id:q.id,correct:ok,time:Date.now()});if(S.history.length>300)S.history.shift();b.locked=true;if(ok){b.combo++;const dmg=S.atk+b.combo*2;b.m.hp=Math.max(0,b.m.hp-dmg);gainXP(18+q.difficulty*6);S.gold+=10;showFeedback(true,q,`-${dmg} HP`);if(b.m.hp<=0){setTimeout(win,500)}}else{const z=S.mistakes[q.id]||{count:0,correct:0};z.count++;z.last=Date.now();S.mistakes[q.id]=z;b.combo=0;const dmg=Math.max(4,b.m.atk-Math.floor(S.def/3));S.hp=Math.max(1,S.hp-dmg);showFeedback(false,q,`-${dmg} HP`)}save()}
function showFeedback(ok,q,msg){const el=document.getElementById('feedback');if(!el)return;el.className='feedback '+(ok?'good':'bad');el.innerHTML=`<b>${ok?'✅ '+t('correct'):'❌ '+t('wrong')}</b><p>${msg}</p>${ok?'':`<p>Correct answer: <b>${q.a}</b></p>`}<p>📚 <b>Why?</b> ${q.e}</p><button data-next>${t('next')} →</button>`;document.querySelectorAll('[data-answer],[data-text-answer]').forEach(x=>x.disabled=true)}
function next(){if(!S.battle)return;if(S.battle.m.hp<=0){S.battle=null;render();return}S.battle.q=null;S.battle.locked=false;render()}
function win(){const b=S.battle;S.kills++;S.streak++;S.gold+=15;if(b.dungeonBoss){S.bosses++;S.gold+=100;gainXP(100);toast('👑 BOSS DEFEATED // +100¢')}else toast('👹 TARGET ELIMINATED // +EXP');if(b.index>=0)S.monsters.splice(b.index,1);if(b.floor){if(b.floor>=5){S.floor=0;S.mode='map'}else{S.floor++;S.mode='dungeon'}}else S.mode='map';S.battle=null;save();render()}
function hint(){if(S.inventory.hint<=0)return toast('NO HINTS');S.inventory.hint--;const q=S.battle.q;document.getElementById('feedback').innerHTML=`<div class="feedback">💡 HINT // ${q.type==='mc'?'Some options can be eliminated.':'Focus on: '+q.e}</div>`;save()}
function skip(){if(S.inventory.skip<=0)return toast('NO SKIP TICKETS');S.inventory.skip--;S.battle.q=null;S.battle.locked=false;save();render()}
function bag(){return `<section class="panel"><h1 class="title">// ${t('bag')}</h1><div class="grid">${[['potion','❤️ HEALTH POTION'],['mana','⚡ MANA POTION'],['hint','💡 HINT'],['skip','⏭️ SKIP TICKET'],['shield','🛡️ SHIELD']].map(x=>`<div class="card"><h3>${x[1]}</h3><div class="statbig">${S.inventory[x[0]]||0}</div>${x[0]==='potion'?'<button data-potion>USE POTION</button>':''}</div>`).join('')}</div><h2>LOADOUT</h2><div class="grid">${S.equipment.map(x=>`<div class="card">⚡ ${x}</div>`).join('')}</div></section>`}
function shop(){const it=[['potion','❤️ HEALTH POTION',35],['mana','⚡ MANA POTION',35],['hint','💡 HINT',45],['skip','⏭️ SKIP TICKET',70],['shield','🛡️ SHIELD',80]];return `<section class="panel"><div class="row"><h1 class="title">// ${t('shop')}</h1><b class="credits">¢ ${S.gold}</b></div><div class="grid">${it.map(x=>`<div class="card"><h3>${x[1]}</h3><p class="muted">PRICE ${x[2]}¢</p><button data-buy="${x[0]}" data-price="${x[2]}">BUY</button></div>`).join('')}</div></section>`}
function mistakes(){const a=Object.entries(S.mistakes).sort((x,y)=>y[1].count-x[1].count);return `<section class="panel"><h1 class="title">// ${t('mistakes')}</h1><p class="muted">Các câu sai nhiều sẽ được ưu tiên xuất hiện lại.</p>${a.length?a.map(([id,v])=>{const q=BANK.find(x=>x.id===id);return `<div class="review"><b>${q?.q||id}</b><p>❌ ${v.count} · ✅ ${v.correct||0}</p><p class="muted">Answer: <b>${q?.a||''}</b><br>${q?.e||''}</p><button data-practice="${id}">${t('practice')}</button></div>`}).join(''):'<div class="card">🎉 NO MISTAKES YET</div>'}</section>`}
function practice(id){const q=BANK.find(x=>x.id===id);if(!q)return;S.battle={m:{name:'REVIEW DRONE',emoji:'📚',hp:35,max:35,atk:0},index:-1,q,combo:0};S.mode='battle';render()}
function profile(){const total=S.history.length,cor=S.history.filter(x=>x.correct).length,acc=total?Math.round(cor/total*100):0;return `<section class="panel"><h1 class="title">// PLAYER PROFILE</h1><div class="grid"><div class="card"><div style="font-size:70px">🧙</div><div class="statbig">LV ${S.level}</div><p>${S.exp}/${need()} EXP</p></div><div class="card"><h3>COMBAT</h3><p>👹 Defeated: ${S.kills}</p><p>👑 Bosses: ${S.bosses}</p><p>⚔️ ATK ${S.atk} · 🛡️ DEF ${S.def}</p></div><div class="card"><h3>LEARNING</h3><p>Questions: ${total}</p><p>Accuracy: <b>${acc}%</b></p><p>🔥 Streak: ${S.streak}</p><p>Question bank: ${BANK.length.toLocaleString()}</p></div></div></section>`}
function startDungeon(){S.mode='dungeon';S.floor=1;S.tower=false;save();render()}function startTower(){S.mode='dungeon';S.floor=1;S.tower=true;save();render()}function dungeon(){const boss=S.floor===5;return `<section class="panel"><div class="row"><div><div class="scan">${S.tower?'TOWER':'DUNGEON'} // FLOOR ${S.floor}/5</div><h1 class="title">${S.tower?'🏯 TOWER OF KNOWLEDGE':'🏰 DUNGEON'}</h1></div><button data-nav="map">← ${t('map')}</button></div><div class="card" style="text-align:center;padding:45px"><div style="font-size:90px">${boss?(S.tower?'🧿':'🐲'):'👺'}</div><h2>${boss?'FINAL FLOOR BOSS':'ELITE ENCOUNTER'}</h2><p class="muted">Difficulty scales with the floor.</p><button class="primary" data-floor-fight>⚔️ ENTER COMBAT</button></div></section>`}
function floorFight(){const boss=S.floor===5;S.battle={m:{name:boss?(S.tower?'TOWER CORE':'DRAGON KING'):'ELITE '+(S.tower?'MAGE':'ORC'),emoji:boss?(S.tower?'🧿':'🐲'):'👺',hp:boss?160:85,max:boss?160:85,atk:boss?22:13},index:-1,q:null,combo:0,dungeonBoss:boss,floor:S.floor,locked:false};S.mode='battle';render()}
function setMode(m){S.mode=m;save();render()}function toggleLang(){lang=lang==='vi'?'en':'vi';localStorage.setItem('englishQuestLang',lang);render()}
function updatePlayer(){const p=document.getElementById('player');if(p){p.style.left=S.x+'%';p.style.top=S.y+'%'}}
function move(dx,dy){if(S.mode!=='map')return;S.x=Math.max(3,Math.min(94,S.x+dx*2.2));S.y=Math.max(5,Math.min(92,S.y+dy*2.2));updatePlayer();const p=document.getElementById('player');if(p){p.classList.add('walk');clearTimeout(window.walk);window.walk=setTimeout(()=>p.classList.remove('walk'),130)}for(let i=0;i<S.monsters.length;i++){const m=S.monsters[i];if(Math.hypot(S.x-m.x,S.y-m.y)<5){encounter(i);break}}save()}
function encounter(i){const m=S.monsters[i];S.battle={m,index:i,q:null,combo:0,locked:false};S.mode='battle';render()}
const keys=new Set();document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){e.preventDefault();keys.add(k)}});document.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));setInterval(()=>{if(S.mode!=='map')return;let dx=0,dy=0;if(keys.has('w')||keys.has('arrowup'))dy--;if(keys.has('s')||keys.has('arrowdown'))dy++;if(keys.has('a')||keys.has('arrowleft'))dx--;if(keys.has('d')||keys.has('arrowright'))dx++;if(dx||dy)move(dx,dy)},45);
function bindUI(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>setMode(b.dataset.nav));document.querySelector('[data-lang]')?.addEventListener('click',toggleLang);document.querySelectorAll('[data-grade]').forEach(b=>b.onclick=()=>chooseGrade(+b.dataset.grade));document.querySelectorAll('[data-monster]').forEach(b=>b.onclick=()=>encounter(+b.dataset.monster));document.querySelectorAll('[data-move]').forEach(b=>{const [x,y]=b.dataset.move.split(',').map(Number);let timer;b.onpointerdown=e=>{e.preventDefault();move(x,y);timer=setInterval(()=>move(x,y),90)};['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>clearInterval(timer)))});document.querySelector('[data-dungeon]')?.addEventListener('click',startDungeon);document.querySelector('[data-tower]')?.addEventListener('click',startTower);document.querySelector('[data-floor-fight]')?.addEventListener('click',floorFight);document.querySelector('[data-hint]')?.addEventListener('click',hint);document.querySelector('[data-skip]')?.addEventListener('click',skip);document.querySelector('[data-next]')?.addEventListener('click',next);document.querySelector('[data-text-answer]')?.addEventListener('click',()=>{const e=document.getElementById('answer');if(e)answer(e.value)});document.getElementById('answer')?.addEventListener('keydown',e=>{if(e.key==='Enter')answer(e.target.value)});document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(decodeURIComponent(b.dataset.answer)));document.querySelector('[data-potion]')?.addEventListener('click',()=>{if(S.inventory.potion&&S.hp<S.maxHp){S.inventory.potion--;S.hp=Math.min(S.maxHp,S.hp+40);save();render()}});document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const k=b.dataset.buy,p=+b.dataset.price;if(S.gold<p)return toast('INSUFFICIENT CREDITS');S.gold-=p;S.inventory[k]++;save();render()});document.querySelectorAll('[data-practice]').forEach(b=>b.onclick=()=>practice(b.dataset.practice))}
render();
</script></body></html>
