<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ENGLISH QUEST // NEON FRONTIER</title><style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap');
:root{--bg:#05060c;--panel:#0b1020;--panel2:#11192b;--cyan:#00f0ff;--pink:#ff25d6;--yellow:#ffe600;--green:#42ff9b;--red:#ff4568;--text:#eafaff;--muted:#8190aa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 0,#182c49,#05060c 48%);color:var(--text);font-family:Rajdhani,Arial,sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer;color:var(--text);background:#111a2d;border:1px solid #30405d;border-radius:5px;padding:11px 14px;font-weight:700}button:hover{border-color:var(--cyan);box-shadow:0 0 16px #00f0ff33}button:disabled{opacity:.5;cursor:not-allowed}button.primary{background:linear-gradient(90deg,#6710b8,#bd149f);border-color:var(--pink)}.app{max-width:1400px;margin:auto;padding:12px}.hud{display:grid;grid-template-columns:250px 1fr auto;gap:14px;align-items:center;background:#070b14ed;border:1px solid #263653;border-top:2px solid var(--cyan);padding:12px;position:sticky;top:0;z-index:50}.logo{font:900 20px Orbitron}.logo b{color:var(--cyan)}.scan{font:9px Orbitron;color:var(--cyan);letter-spacing:2px;margin-top:4px}.meters{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.meter{background:#0a111f;border:1px solid #23304a;padding:5px 8px}.meter small{display:flex;justify-content:space-between;color:var(--muted)}.bar{height:5px;background:#1d2637;margin-top:4px}.bar i{display:block;height:100%;background:var(--cyan)}.hp i{background:var(--red)}.xp i{background:var(--yellow)}.credits{font:700 15px Orbitron;color:var(--yellow)}.panel{margin-top:12px;background:linear-gradient(145deg,#0d1525,#070c15);border:1px solid #263653;padding:18px;position:relative}.title{font:900 25px Orbitron;margin:0 0 8px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{background:#101a2b;border:1px solid #283956;padding:15px}.nav{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.nav .active{color:var(--cyan);border-color:var(--cyan);background:#0d2630}.world{height:610px;position:relative;overflow:hidden;background:radial-gradient(circle at 60% 25%,#123847,#08141e 55%,#050a10);border:2px solid #1b6975;touch-action:none}.world:after{content:"";position:absolute;inset:0;background:linear-gradient(#00f0ff09 1px,transparent 1px),linear-gradient(90deg,#00f0ff09 1px,transparent 1px);background-size:38px 38px;pointer-events:none}.city{position:absolute;bottom:0;width:100%;height:24%;background:repeating-linear-gradient(90deg,#080e18 0 65px,#172235 65px 70px);border-top:1px solid #24435b}.neon{position:absolute;height:3px;background:var(--cyan);box-shadow:0 0 14px var(--cyan)}.place{position:absolute;z-index:4;background:#050a13dd;border:1px solid #35516e;padding:6px 9px;font-size:12px}.player{position:absolute;z-index:15;width:52px;height:58px;font-size:42px;display:grid;place-items:center;filter:drop-shadow(0 0 12px var(--cyan));will-change:left,top}.player.walk{animation:bob .15s infinite alternate}@keyframes bob{to{transform:translateY(-4px)}}.monster{position:absolute;z-index:12;width:54px;height:54px;border-radius:50%;padding:0;display:grid;place-items:center;font-size:29px;background:#26102a;border:1px solid var(--pink);box-shadow:0 0 18px #ff25d655}.npc{position:absolute;z-index:8;font-size:30px}.controls{position:absolute;z-index:30;right:14px;bottom:14px;display:grid;grid-template-columns:56px 56px 56px;gap:6px}.controls button{height:52px;padding:0}.up{grid-column:2}.left{grid-column:1}.down{grid-column:2}.right{grid-column:3}.battle{display:grid;grid-template-columns:230px 1fr 230px;gap:14px}.fighter{background:#09101d;border:1px solid #30415f;padding:15px;text-align:center}.fighter.enemy{border-color:var(--pink);box-shadow:inset 0 0 35px #ff25d60a}.fighter.hero{border-color:var(--cyan)}.avatar{font-size:75px}.bigbar{height:13px;background:#20283a;margin:9px 0}.bigbar span{display:block;height:100%;background:var(--pink);transition:.3s}.hero .bigbar span{background:var(--cyan)}.question{background:#070c16;border:1px solid #30415f;padding:20px;min-height:390px}.qmeta{color:var(--cyan);font:10px Orbitron;letter-spacing:1px}.qtext{font-size:25px;font-weight:700;line-height:1.35;margin:20px 0}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}.option{min-height:55px;text-align:left;border-left:3px solid var(--cyan);font-size:17px}.option.correct{border-color:var(--green);background:#0d3827}.option.wrong{border-color:var(--red);background:#3a1420}.answerbox{width:100%;padding:13px;background:#050913;border:1px solid #405172;color:white;outline:none}.answerbox:focus{border-color:var(--cyan);box-shadow:0 0 14px #00f0ff33}.feedback{margin-top:15px;padding:13px;border:1px solid #344565;background:#10192b}.feedback.good{border-color:var(--green)}.feedback.bad{border-color:var(--red)}.feedback button{margin-top:9px}.review{margin:8px 0;padding:12px;background:#10192a;border-left:3px solid var(--red)}.toast{position:fixed;right:18px;bottom:18px;background:#091322;border:1px solid var(--cyan);padding:13px 16px;z-index:100;box-shadow:0 0 20px #00f0ff55}.tag{display:inline-block;border:1px solid #36506c;padding:4px 7px;margin:2px;color:var(--cyan);font-size:11px}.statbig{font:900 24px Orbitron;color:var(--cyan)}@media(max-width:850px){.hud{grid-template-columns:1fr}.meters{grid-template-columns:1fr 1fr}.battle{grid-template-columns:1fr}.options{grid-template-columns:1fr}.world{height:68vh;min-height:500px}.qtext{font-size:21px}}
</style></head><body><main id="app" class="app"></main><div id="toast" class="toast" style="display:none"></div><script>
'use strict';
const WORLDS=[['Green Valley','🌿',['Family','School','Friends','Animals','Food','Hobbies']],['Crystal Forest','💎',['Health','Environment','Travel','Community','Communication']],['Mystic Kingdom','🔮',['Science','Technology','Culture','Environment']],['Dragon Valley','🐉',['Grammar','Reading','Vocabulary','Communication']],['Ancient Academy','🏛️',['Grammar','Reading','Vocabulary']],['Shadow Empire','🌑',['Reading','Grammar','Vocabulary']],['Final Kingdom','⚡',['Exam grammar','Reading','Vocabulary']]];
const VERBS=[['play','plays','played'],['watch','watches','watched'],['study','studies','studied'],['wash','washes','washed'],['visit','visits','visited'],['carry','carries','carried'],['go','goes','went'],['have','has','had'],['do','does','did'],['try','tries','tried'],['read','reads','read'],['make','makes','made']];const OBJECTS=['football','English','books','music','chess','the piano','cartoons','computer games','science','breakfast','homework','stories'];const WORDS=[['library','thư viện'],['hospital','bệnh viện'],['forest','khu rừng'],['journey','hành trình'],['healthy','khỏe mạnh'],['pollution','ô nhiễm'],['recycle','tái chế'],['festival','lễ hội'],['neighbor','hàng xóm'],['environment','môi trường'],['technology','công nghệ'],['community','cộng đồng'],['adventure','cuộc phiêu lưu'],['equipment','trang thiết bị'],['protect','bảo vệ'],['discover','khám phá'],['dangerous','nguy hiểm'],['ancient','cổ đại'],['culture','văn hóa'],['communication','giao tiếp']];
const BANK=[];let qid=0;const add=q=>BANK.push({id:'Q'+String(++qid).padStart(5,'0'),...q});for(let g=6;g<=12;g++){let w=WORLDS[g-6];for(let i=0;i<500;i++){let v=VERBS[i%VERBS.length],o=OBJECTS[i%OBJECTS.length],topic=w[2][i%w[2].length],d=Math.min(5,1+Math.floor(i/100));if(i%4===0){let sub=i%3===1?'They':i%3===2?'He':'She',a=sub==='They'?v[0]:v[1];add({grade:g,world:w[0],topic,skill:'Grammar',difficulty:d,type:'mc',q:`${sub} ___ ${o} every day.`,o:[a,sub==='They'?v[1]:v[0],v[2],'going'],a,e:sub==='They'?'They dùng động từ nguyên mẫu.':'He/She + V(s/es) ở hiện tại đơn.'})}else if(i%4===1){let x=WORDS[i%WORDS.length];add({grade:g,world:w[0],topic,skill:'Vocabulary',difficulty:d,type:'mc',q:`Which word means “${x[1]}”?`,o:[x[0],'window','station','garden'],a:x[0],e:`${x[0]} = ${x[1]}.`})}else if(i%4===2){add({grade:g,world:w[0],topic,skill:'Grammar',difficulty:d,type:'fill',q:`Yesterday, I ___ ${o}.`,o:[],a:v[2],e:`“Yesterday” báo hiệu quá khứ đơn: ${v[0]} → ${v[2]}.`})}else{let sub=i%2?'I':'My friend',verb=sub==='I'?v[0]:v[1];add({grade:g,world:w[0],topic,skill:'Sentence arrangement',difficulty:d,type:'arrange',q:`Arrange: ${verb} / ${o} / ${sub}.`,o:[],a:`${sub} ${verb} ${o}.`,e:'Trật tự cơ bản: Subject + Verb + Object.'})}}
const DEF={grade:null,level:1,exp:0,gold:150,hp:100,maxHp:100,mana:80,maxMana:80,atk:10,def:5,streak:0,x:50,y:60,mode:'map',history:[],mistakes:{},inventory:{potion:2,hint:3,skip:1,shield:1},equipment:['NOVICE BLADE'],kills:0,bosses:0,monsters:[],battle:null,floor:0,tower:false};let saved={};try{saved=JSON.parse(localStorage.getItem('englishQuestSave')||'{}')||{}}catch(e){}const S=Object.assign({},DEF,saved);S.inventory=Object.assign({},DEF.inventory,saved.inventory||{});S.history=Array.isArray(saved.history)?saved.history:[];S.mistakes=saved.mistakes||{};let lang=localStorage.getItem('englishQuestLang')||'vi';const UI={vi:{map:'Bản đồ',bag:'Túi đồ',shop:'Cửa hàng',mistakes:'Sổ lỗi',profile:'Hồ sơ',choose:'Chọn lớp',hint:'Gợi ý',skip:'Bỏ qua',attack:'TẤN CÔNG',next:'Tiếp tục'},en:{map:'Map',bag:'Inventory',shop:'Shop',mistakes:'Mistake Book',profile:'Profile',choose:'Choose Grade',hint:'Hint',skip:'Skip',attack:'ATTACK',next:'Continue'}};const t=k=>UI[lang][k]||k;
function save(){localStorage.setItem('englishQuestSave',JSON.stringify(S))}function toast(x){let e=document.getElementById('toast');e.textContent=x;e.style.display='block';clearTimeout(window._toast);window._toast=setTimeout(()=>e.style.display='none',1600)}function need(){return 120+(S.level-1)*90}function gainXP(n){S.exp+=n;while(S.exp>=need()){S.exp-=need();S.level++;S.maxHp+=10;S.maxMana+=5;S.atk+=2;S.def++;S.hp=S.maxHp;toast('LEVEL UP // '+S.level)}save()}
function header(){return `<header class="hud"><div class="logo">ENGLISH <b>QUEST</b><div class="scan">NEON FRONTIER // ONLINE</div></div><div class="meters"><div class="meter hp"><small>HP <span>${S.hp}/${S.maxHp}</span></small><div class="bar"><i style="width:${S.hp/S.maxHp*100}%"></i></div></div><div class="meter"><small>MANA <span>${S.mana}/${S.maxMana}</span></small><div class="bar"><i style="width:${S.mana/S.maxMana*100}%"></i></div></div><div class="meter xp"><small>LV ${S.level} <span>${S.exp}/${need()}</span></small><div class="bar"><i style="width:${S.exp/need()*100}%"></i></div></div></div><div class="credits">₡ ${S.gold}</div></header>`}
function nav(){return `<nav class="nav">${[['map','🗺️ '+t('map')],['bag','🎒 '+t('bag')],['shop','🏪 '+t('shop')],['mistakes','📖 '+t('mistakes')],['profile','👤 '+t('profile')]].map(a=>`<button data-nav="${a[0]}" class="${S.mode===a[0]?'active':''}">${a[1]}</button>`).join('')}<button data-action="lang">🌐 ${lang==='vi'?'EN':'VI'}</button></nav>`}
function render(){document.getElementById('app').innerHTML=header()+view()+nav();if(S.mode==='map')updatePlayer();}
function view(){if(!S.grade)return choose();return S.mode==='map'?map():S.mode==='battle'?battle():S.mode==='bag'?bag():S.mode==='shop'?shop():S.mode==='mistakes'?mistakes():S.mode==='profile'?profile():S.mode==='dungeon'?dungeon():map()}
function choose(){return `<section class="panel"><h1 class="title">NEON FRONTIER // ${t('choose')}</h1><p class="muted">Question Engine: <b>${BANK.length.toLocaleString()}</b> câu · 500 câu mỗi lớp.</p><div class="grid">${WORLDS.map((w,i)=>`<button class="card choice" data-grade="${i+6}"><div style="font-size:48px">${w[1]}</div><h2>GRADE ${i+6} // ${w[0]}</h2><p class="muted">${w[2].join(' · ')}</p><span class="tag">500 QUESTIONS</span></button>`).join('')}</div></section>`}
function map(){if(!S.monsters.length)spawn();let w=WORLDS[S.grade-6];return `<section class="panel"><div class="row"><div><h1 class="title">${w[1]} ${w[0]}</h1><span class="tag">EXPLORE</span><span class="tag">GRADE ${S.grade}</span></div><div class="muted">WASD / ARROWS / TOUCH</div></div><div class="world"><div class="city"></div><div class="neon" style="left:10%;top:45%;width:70%;transform:rotate(-7deg)"></div><div class="neon" style="left:55%;top:75%;width:35%"></div><div class="place" style="left:16%;top:78%">🏙️ NEON CITY</div><div class="place" style="left:48%;top:18%">🏰 DUNGEON</div><div class="place" style="left:83%;top:76%">🏯 TOWER</div><div class="place" style="left:80%;top:24%">👑 BOSS ZONE</div><div class="npc" style="left:25%;top:45%">🦉</div><div class="place" style="left:22%;top:52%">PROF. OWL</div><div id="player" class="player" style="left:${S.x}%;top:${S.y}%">🧙</div>${S.monsters.map((m,i)=>`<button class="monster" data-monster="${i}" style="left:${m.x}%;top:${m.y}%">${m.e}</button>`).join('')}<div class="controls"><button class="up" data-move="0,-1">▲</button><button class="left" data-move="-1,0">◀</button><button class="down" data-move="0,1">▼</button><button class="right" data-move="1,0">▶</button></div></div><div class="grid" style="margin-top:12px"><div class="card"><b>🏰 DUNGEON</b><p class="muted">5 tầng prototype · boss tầng cuối.</p><button data-action="dungeon">ENTER</button></div><div class="card"><b>🏯 TOWER</b><p class="muted">5 tầng prototype · mở rộng được lên 50.</p><button data-action="tower">CLIMB</button></div><div class="card"><b>📚 QUESTION ENGINE</b><p class="muted">${BANK.length.toLocaleString()} câu · anti-repeat · mistake priority.</p></div></div></section>`}
function spawn(){S.monsters=[['Slime','🟢',45,8,38,35],['Goblin','👹',60,10,62,48],['Bat','🦇',50,9,74,36],['Wolf','🐺',70,12,40,74],['Orc','👺',90,15,78,65]].map(x=>({name:x[0],e:x[1],hp:x[2],max:x[2],atk:x[3],x:x[4],y:x[5]}))}
function updatePlayer(){let p=document.getElementById('player');if(p){p.style.left=S.x+'%';p.style.top=S.y+'%'}}function move(dx,dy){if(S.mode!=='map')return;S.x=Math.max(4,Math.min(92,S.x+dx*2.4));S.y=Math.max(5,Math.min(88,S.y+dy*2.4));updatePlayer();document.getElementById('player')?.classList.add('walk');clearTimeout(window.walkTimer);window.walkTimer=setTimeout(()=>document.getElementById('player')?.classList.remove('walk'),180);S.monsters.forEach((m,i)=>{if(Math.hypot(S.x-m.x,S.y-m.y)<6)startBattle(i)});save()}
let keys=new Set();window.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){e.preventDefault();keys.add(k)}});window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));setInterval(()=>{if(S.mode==='map'&&keys.size){if(keys.has('w')||keys.has('arrowup'))move(0,-1);else if(keys.has('s')||keys.has('arrowdown'))move(0,1);else if(keys.has('a')||keys.has('arrowleft'))move(-1,0);else if(keys.has('d')||keys.has('arrowright'))move(1,0)}},55);
function pickQuestion(){let pool=BANK.filter(q=>q.grade===S.grade),recent=new Set(S.history.slice(-25).map(x=>x.id)),weak=pool.filter(q=>S.mistakes[q.id]?.count>1);let available=(weak.length&&Math.random()<.45?weak:pool).filter(q=>!recent.has(q.id));if(!available.length)available=pool;return available[Math.floor(Math.random()*available.length)]}
function startBattle(i){if(S.mode!=='map')return;let m=S.monsters[i];S.battle={enemy:m,index:i,q:pickQuestion(),locked:false,combo:0};S.mode='battle';render()}
function battle(){let b=S.battle,q=b.q,m=b.enemy;return `<section class="panel"><div class="row"><span class="tag">BATTLE // ${q.skill}</span><span class="tag">${'★'.repeat(q.difficulty)}</span><button data-nav="map">← ${t('map')}</button></div><div class="battle" style="margin-top:12px"><div class="fighter enemy"><div class="avatar">${m.e}</div><h2>${m.name}</h2><div class="bigbar"><span style="width:${m.hp/m.max*100}%"></span></div><b>${m.hp}/${m.max} HP</b></div><div class="question"><div class="qmeta">${q.id} // ${q.topic} // ${q.skill}</div><div class="qtext">${q.q}</div>${questionInput(q)}<div id="feedback"></div></div><div class="fighter hero"><div class="avatar">🧙</div><h2>PLAYER</h2><div class="bigbar"><span style="width:${S.hp/S.maxHp*100}%"></span></div><b>❤️ ${S.hp}/${S.maxHp}</b><p>⚔️ ${S.atk} · 🛡️ ${S.def}</p><p>🔥 COMBO x${b.combo}</p></div></div></section>`}
function questionInput(q){if(q.type==='mc')return `<div class="options">${q.o.map((x,i)=>`<button class="option" data-answer="${encodeURIComponent(x)}">${String.fromCharCode(65+i)}. ${x}</button>`).join('')}</div><div class="nav"><button data-action="hint">💡 ${t('hint')} (${S.inventory.hint})</button><button data-action="skip">⏭️ ${t('skip')} (${S.inventory.skip})</button></div>`;return `<input id="answerbox" class="answerbox" autocomplete="off" placeholder="${q.type==='fill'?'Type your answer':'Type the complete sentence'}"><button class="primary" style="margin-top:10px;width:100%" data-action="submit-answer">⚔️ ${t('attack')}</button><div class="nav"><button data-action="hint">💡 ${t('hint')} (${S.inventory.hint})</button><button data-action="skip">⏭️ ${t('skip')} (${S.inventory.skip})</button></div>`}
function normalize(x){return String(x).trim().toLowerCase().replace(/[.!?]+$/,'').replace(/\s+/g,' ')}
function submitAnswer(value){let b=S.battle;if(!b||b.locked)return;let q=b.q,ok=normalize(value)===normalize(q.a);b.locked=true;document.querySelectorAll('[data-answer],#answerbox,[data-action="submit-answer"]').forEach(e=>e.disabled=true);S.history.push({id:q.id,correct:ok,at:Date.now()});if(S.history.length>300)S.history.shift();if(!ok){let z=S.mistakes[q.id]||{count:0,correct:0};z.count++;z.last=Date.now();S.mistakes[q.id]=z;b.combo=0;let dmg=Math.max(3,Math.round(b.enemy.atk-S.def*.25));S.hp=Math.max(1,S.hp-dmg);showFeedback(false,q,`-${dmg} HP`)}else{if(S.mistakes[q.id])S.mistakes[q.id].correct=(S.mistakes[q.id].correct||0)+1;b.combo++;let dmg=S.atk+b.combo*2;b.enemy.hp=Math.max(0,b.enemy.hp-dmg);gainXP(18+q.difficulty*5);S.gold+=10;showFeedback(true,q,`-${dmg} HP`)}save()}
function showFeedback(ok,q,msg){let e=document.getElementById('feedback');if(!e)return;e.className='feedback '+(ok?'good':'bad');e.innerHTML=`<b>${ok?'⚡ '+t('attack')+' // HIT':'💥 WRONG // LEARN'}</b><p>${msg}</p>${ok?'':'<p>✅ <b>Correct:</b> '+q.a+'</p>'}<p>📚 <b>Why?</b> ${q.e}</p><button data-action="continue">${t('next')} ▶</button>`}
function continueBattle(){let b=S.battle;if(!b)return;if(b.enemy.hp<=0){S.kills++;S.streak++;S.gold+=15;S.mode='map';S.battle=null;if(!S.monsters.length)spawn();save();toast('🏆 ENEMY DEFEATED // +EXP +GOLD');render()}else{b.q=pickQuestion();b.locked=false;render()}}
function hint(){if(!S.battle||S.inventory.hint<=0||S.battle.locked)return;S.inventory.hint--;let q=S.battle.q;let msg=q.type==='mc'?'💡 Một số lựa chọn khác không phù hợp với ngữ pháp/nghĩa.':'💡 '+q.e;let e=document.getElementById('feedback');e.className='feedback';e.innerHTML=msg;save()}
function skip(){if(!S.battle||S.inventory.skip<=0||S.battle.locked)return;S.inventory.skip--;S.battle.q=pickQuestion();save();render()}
function bag(){return `<section class="panel"><h1 class="title">🎒 INVENTORY</h1><div class="grid">${[['potion','❤️ Health Potion'],['hint','💡 Hint'],['skip','⏭️ Skip Ticket'],['shield','🛡️ Shield']].map(x=>`<div class="card"><b>${x[1]}</b><div class="statbig">${S.inventory[x[0]]||0}</div>${x[0]==='potion'?'<button data-action="potion">USE</button>':''}</div>`).join('')}</div><h2>⚔️ Equipment</h2>${S.equipment.map(x=>`<span class="tag">${x}</span>`).join('')}</section>`}
function shop(){let items=[['potion','❤️ Health Potion',35],['hint','💡 Hint',45],['skip','⏭️ Skip Ticket',70],['shield','🛡️ Shield',80]];return `<section class="panel"><div class="row"><h1 class="title">🏪 NIGHT MARKET</h1><b class="credits">₡ ${S.gold}</b></div><div class="grid">${items.map(x=>`<div class="card"><b>${x[1]}</b><p class="muted">${x[2]} credits</p><button data-buy="${x[0]}" data-price="${x[2]}">BUY</button></div>`).join('')}</div></section>`}
function mistakes(){let a=Object.entries(S.mistakes).sort((x,y)=>y[1].count-x[1].count);return `<section class="panel"><h1 class="title">📖 MISTAKE BOOK</h1>${a.length?a.map(([id,v])=>{let q=BANK.find(x=>x.id===id);return `<div class="review"><b>${q?.q||id}</b><p>❌ ${v.count} · ✅ ${v.correct||0} · ${q?.topic||''}</p><p>Correct: <b>${q?.a||''}</b><br>${q?.e||''}</p><button data-practice="${id}">${t('practice')}</button></div>`}).join(''):'<div class="card">🎉 Chưa có lỗi. Hãy chiến đấu để xây dựng Sổ lỗi.</div>'}</section>`}
function profile(){let total=S.history.length,cor=S.history.filter(x=>x.correct).length,acc=total?Math.round(cor/total*100):0;return `<section class="panel"><h1 class="title">👤 PLAYER PROFILE</h1><div class="grid"><div class="card"><div style="font-size:65px">🧙</div><div class="statbig">LEVEL ${S.level}</div><p>${S.exp}/${need()} EXP</p></div><div class="card"><b>COMBAT</b><p>❤️ ${S.hp}/${S.maxHp}</p><p>⚔️ ${S.atk} · 🛡️ ${S.def}</p><p>👹 ${S.kills} defeated</p></div><div class="card"><b>LEARNING</b><p>Questions: ${total}</p><p>Accuracy: <b>${acc}%</b></p><p>🔥 Streak: ${S.streak}</p><p>Bank: ${BANK.length.toLocaleString()}</p></div></div></section>`}
function dungeon(){return `<section class="panel"><div class="row"><h1 class="title">🏰 ${S.tower?'TOWER OF KNOWLEDGE':'DUNGEON'} // FLOOR ${S.floor||1}/5</h1><button data-nav="map">← ${t('map')}</button></div><div class="card" style="text-align:center;padding:40px"><div style="font-size:80px">${S.floor===5?'👑':'👹'}</div><h2>${S.floor===5?'BOSS FLOOR':'ELITE FLOOR'}</h2><p class="muted">Câu hỏi khó hơn theo từng tầng.</p><button class="primary" data-action="floor">ENTER COMBAT</button></div></section>`}
function enterDungeon(tower){S.mode='dungeon';S.floor=1;S.tower=tower;save();render()}function floorFight(){let boss=S.floor===5;S.battle={enemy:{name:boss?'NEON DRAGON':'ELITE '+(S.tower?'MAGE':'ORC'),e:boss?'🐉':'👺',hp:boss?180:90,max:boss?180:90,atk:boss?22:14},index:-1,q:pickQuestion(),locked:false,combo:0};S.mode='battle';render()}
function setMode(m){S.mode=m;save();render()}
/* ===================== ONE GLOBAL CLICK ROUTER ===================== */
document.addEventListener('click',function(e){let el=e.target.closest('button,input');if(!el)return;
if(el.dataset.nav){setMode(el.dataset.nav);return}if(el.dataset.grade){S.grade=Number(el.dataset.grade);S.x=50;S.y=60;S.monsters=[];S.mode='map';spawn();save();render();return}if(el.dataset.monster!==undefined){startBattle(Number(el.dataset.monster));return}if(el.dataset.move){let [dx,dy]=el.dataset.move.split(',').map(Number);move(dx,dy);return}if(el.dataset.answer!==undefined){submitAnswer(decodeURIComponent(el.dataset.answer));return}if(el.dataset.action==='submit-answer'){submitAnswer(document.getElementById('answerbox')?.value||'');return}if(el.dataset.action==='continue'){continueBattle();return}if(el.dataset.action==='hint'){hint();return}if(el.dataset.action==='skip'){skip();return}if(el.dataset.action==='potion'){if(S.inventory.potion&&S.hp<S.maxHp){S.inventory.potion--;S.hp=Math.min(S.maxHp,S.hp+40);save();render()}return}if(el.dataset.action==='lang'){lang=lang==='vi'?'en':'vi';localStorage.setItem('englishQuestLang',lang);render();return}if(el.dataset.action==='dungeon'){enterDungeon(false);return}if(el.dataset.action==='tower'){enterDungeon(true);return}if(el.dataset.action==='floor'){floorFight();return}if(el.dataset.buy){let p=Number(el.dataset.price);if(S.gold>=p){S.gold-=p;S.inventory[el.dataset.buy]++;save();render()}else toast('NOT ENOUGH CREDITS');return}if(el.dataset.practice){let q=BANK.find(x=>x.id===el.dataset.practice);if(q){S.battle={enemy:{name:'REVIEW',e:'📚',hp:40,max:40,atk:0},index:-1,q,locked:false,combo:0};S.mode='battle';render()}return}});
document.addEventListener('keydown',e=>{if(S.mode==='battle'&&e.key==='Enter'&&document.activeElement?.id==='answerbox'){e.preventDefault();submitAnswer(document.activeElement.value)}});
render();
</script></body></html>
