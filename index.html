<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Quest: Tower of Words</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f5f7ff;font-family:system-ui,Segoe UI,sans-serif}.app{max-width:1250px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;background:#141c35;border:1px solid #344466;border-radius:16px;padding:12px;position:sticky;top:8px;z-index:30}.brand{font-weight:900;font-size:18px}.stats{display:flex;gap:7px;flex-wrap:wrap}.stat,.badge{background:#222d4c;padding:7px 10px;border-radius:9px;font-size:12px}.panel{margin-top:14px;background:#151d37;border:1px solid #344466;border-radius:18px;padding:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.card{background:#202a49;border:1px solid #3a496c;border-radius:14px;padding:14px}button{border:0;border-radius:10px;padding:10px 13px;background:#283657;color:#fff;font-weight:750;cursor:pointer}button:hover{filter:brightness(1.15)}button.primary{background:#7059e8}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.nav button.active{background:#7059e8}.world{position:relative;height:620px;max-height:68vh;min-height:440px;overflow:hidden;border:2px solid #496082;border-radius:20px;background:linear-gradient(#77aa60,#60934d);touch-action:none}.world:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 47px,#ffffff09 48px),repeating-linear-gradient(90deg,transparent 0 47px,#ffffff09 48px)}.lake{position:absolute;width:260px;height:150px;border-radius:50%;background:#438fb7;left:58%;top:12%}.forest{position:absolute;left:3%;top:5%;font-size:62px}.mountain{position:absolute;right:2%;bottom:-5px;font-size:105px;opacity:.7}.place{position:absolute;transform:translate(-50%,-50%);padding:7px 9px;background:#11182cdd;border:1px solid #68799e;border-radius:9px;font-size:11px;z-index:2}.player{position:absolute;left:50%;top:65%;width:48px;height:56px;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;font-size:39px;z-index:10;filter:drop-shadow(0 5px 5px #0008);transition:left .08s linear,top .08s linear}.player.walk{animation:bob .18s infinite alternate}@keyframes bob{to{transform:translate(-50%,-55%)}}.monster{position:absolute;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;background:#4b2740;border:2px solid #ff9baa;z-index:8}.npc{position:absolute;width:48px;height:48px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:28px;background:#7655a8;border:2px solid #e6d0ff;z-index:5}.controls{position:absolute;right:14px;bottom:14px;display:grid;grid-template-columns:repeat(3,52px);gap:6px;z-index:20}.controls button{height:50px;font-size:19px}.controls .up{grid-column:2}.controls .left{grid-column:1}.controls .down{grid-column:2}.controls .right{grid-column:3}.battle{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:12px;align-items:center}.fighter{text-align:center;background:#202a49;border-radius:16px;padding:16px}.avatar{font-size:70px}.question{background:#0f162b;border-radius:16px;padding:18px}.options{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.feedback{margin-top:12px;background:#222d4c;padding:12px;border-radius:11px}.review{border-left:4px solid #ff6875;background:#202a49;padding:11px;margin:8px 0;border-radius:10px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.muted{color:#aeb9d5}.title{margin:0 0 8px}.toast{position:fixed;right:16px;bottom:16px;background:#273457;border:1px solid #6477a3;padding:12px 15px;border-radius:11px;z-index:100}@keyframes hit{50%{transform:translate(-50%,-50%) scale(1.2)}}.hit{animation:hit .25s}.small{font-size:12px}@media(max-width:760px){.top{flex-direction:column;align-items:flex-start}.world{height:70vh;min-height:500px}.battle{grid-template-columns:1fr}.options{grid-template-columns:1fr}.avatar{font-size:52px}}</style></head><body><main id="app" class="app"></main><div id="toast" class="toast hidden"></div><script>
const worlds=[{grade:6,name:'Green Valley',emoji:'🌳',topics:['Family','School','Friends','Animals','Food','Daily activities','Hobbies','Places']},{grade:7,name:'Crystal Forest',emoji:'💎',topics:['Health','Environment','Travel','Community','Hobbies','Communication']},{grade:8,name:'Mystic Kingdom',emoji:'🔮',topics:['Natural disasters','Science','Technology','Life','Culture','Environment']},{grade:9,name:'Dragon Valley',emoji:'🐉',topics:['Grammar','Reading','Vocabulary','Communication','Sentence transformation']},{grade:10,name:'Ancient Academy',emoji:'🏛️',topics:['Grammar','Reading','Vocabulary','Communication']},{grade:11,name:'Shadow Empire',emoji:'🌑',topics:['Reading','Grammar','Vocabulary','Critical thinking']},{grade:12,name:'Final Kingdom',emoji:'⚡',topics:['Exam grammar','Reading','Vocabulary','Translation']}];
const vocab=[['apple','quả táo'],['library','thư viện'],['hospital','bệnh viện'],['forest','khu rừng'],['journey','hành trình'],['healthy','khỏe mạnh'],['pollution','ô nhiễm'],['recycle','tái chế'],['festival','lễ hội'],['neighbor','hàng xóm'],['environment','môi trường'],['technology','công nghệ'],['community','cộng đồng'],['adventure','cuộc phiêu lưu'],['equipment','trang thiết bị']];const verbs=[['play','plays','played'],['watch','watches','watched'],['study','studies','studied'],['wash','washes','washed'],['visit','visits','visited'],['carry','carries','carried'],['go','goes','went'],['have','has','had'],['do','does','did'],['try','tries','tried']];const objects=['football','English','books','music','chess','the piano','cartoons','computer games','science','breakfast'];const bank=[];let qid=1;function add(q){bank.push(q)}for(const w of worlds){for(let i=0;i<500;i++){const topic=w.topics[i%w.topics.length],difficulty=Math.min(5,1+Math.floor(i/100)),v=verbs[i%verbs.length],obj=objects[i%objects.length],id=`g${w.grade}-${String(qid++).padStart(4,'0')}`;if(i%4===0){const sub=i%3===0?'She':i%3===1?'He':'They',a=sub==='They'?v[0]:v[1];add({id,grade:w.grade,world:w.name,topic,skill:'Grammar',difficulty,type:'mc',q:`${sub} ___ ${obj} every day.`,o:[a,sub==='They'?v[1]:v[0],v[2],'going'],a,e:'Present simple: He/She/It dùng V(s/es); They dùng động từ nguyên mẫu.'})}else if(i%4===1){const x=vocab[i%vocab.length];add({id,grade:w.grade,world:w.name,topic,skill:'Vocabulary',difficulty,type:'mc',q:`Which word means “${x[1]}”?`,o:[x[0],'window','garden','station'],a:x[0],e:`${x[0]} = ${x[1]}.`})}else if(i%4===2){add({id,grade:w.grade,world:w.name,topic,skill:'Grammar',difficulty,type:'fill',q:`Yesterday, I ___ ${obj}.`,a:v[2],e:`“Yesterday” báo hiệu quá khứ đơn. ${v[0]} → ${v[2]}.`})}else{const sub=i%2?'I':'My friend',verb=sub==='I'?v[0]:v[1];add({id,grade:w.grade,world:w.name,topic,skill:'Sentence arrangement',difficulty,type:'arrange',q:`Arrange: ${verb} / ${obj} / ${sub}`,a:`${sub} ${verb} ${obj}.`,e:'Trật tự cơ bản: Subject + Verb + Object.'})}}}
const defaults={grade:null,level:1,exp:0,gold:150,hp:100,maxHp:100,mana:80,maxMana:80,atk:10,def:5,streak:0,x:50,y:65,mode:'map',monsters:[],history:[],mistakes:{},inventory:{potion:2,hint:3,skip:1,shield:1},equipment:['Novice Sword'],kills:0,bosses:0,floor:0,tower:false};let S=Object.assign({},defaults,JSON.parse(localStorage.getItem('eqSave')||'{}'));S.inventory=Object.assign(defaults.inventory,S.inventory||{});let lang=localStorage.getItem('eqLang')||'vi';const I={vi:{map:'Bản đồ',bag:'Túi đồ',shop:'Cửa hàng',mistakes:'Sổ lỗi',profile:'Hồ sơ',choose:'Chọn lớp',start:'Bắt đầu',back:'Quay lại',hint:'Gợi ý',skip:'Bỏ qua',practice:'Luyện lại',dungeon:'Hầm ngục',tower:'Tháp',correct:'Chính xác!',wrong:'Sai rồi!'},en:{map:'Map',bag:'Inventory',shop:'Shop',mistakes:'Mistake Book',profile:'Profile',choose:'Choose grade',start:'Start',back:'Back',hint:'Hint',skip:'Skip',practice:'Practice',dungeon:'Dungeon',tower:'Tower',correct:'Correct!',wrong:'Not quite!'}};const t=k=>I[lang][k]||k;function save(){localStorage.setItem('eqSave',JSON.stringify(S))}function toast(x){const e=document.getElementById('toast');e.textContent=x;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),1700)}function need(){return 120+(S.level-1)*90}function gain(n){S.exp+=n;while(S.exp>=need()){S.exp-=need();S.level++;S.maxHp+=10;S.maxMana+=5;S.atk+=2;S.def++;S.hp=S.maxHp;toast('✨ Level Up! Lv.'+S.level)}save()}
function header(){return `<header class="top"><div class="brand">⚔️ English Quest <span class="muted">· Tower of Words</span></div><div class="stats"><span class="stat">❤️ ${S.hp}/${S.maxHp}</span><span class="stat">⚡ ${S.mana}/${S.maxMana}</span><span class="stat">💰 ${S.gold}</span><span class="stat">⭐ Lv.${S.level}</span><span class="stat">🔥 ${S.streak}</span></div></header>`}function nav(){return `<nav class="nav">${[['map','🗺️ '+t('map')],['bag','🎒 '+t('bag')],['shop','🏪 '+t('shop')],['mistakes','📖 '+t('mistakes')],['profile','👤 '+t('profile')]].map(([m,n])=>`<button class="${S.mode===m?'active':''}" onclick="setMode('${m}')">${n}</button>`).join('')}<button onclick="toggleLang()">🌐 ${lang==='vi'?'EN':'VI'}</button></nav>`}function render(){document.getElementById('app').innerHTML=header()+view()+nav();if(S.mode==='map')bindKeys()}
function choose(){return `<div class="panel"><h1 class="title">🌎 ${t('choose')}</h1><p class="muted">Ngân hàng: <b>${bank.length.toLocaleString()}</b> câu hỏi.</p><div class="grid">${worlds.map(w=>`<button class="card" onclick="chooseGrade(${w.grade})"><div style="font-size:45px">${w.emoji}</div><b>Lớp ${w.grade} · ${w.name}</b><p class="muted">${w.topics.slice(0,4).join(' · ')}</p><span class="badge">500 questions</span></button>`).join('')}</div></div>`}function view(){if(!S.grade)return choose();return S.mode==='map'?map():S.mode==='battle'?battle():S.mode==='bag'?bag():S.mode==='shop'?shop():S.mode==='mistakes'?mistakes():S.mode==='profile'?profile():S.mode==='dungeon'?dungeon():map()}
function chooseGrade(g){S.grade=g;S.mode='map';S.x=50;S.y=65;spawn();save();render()}function spawn(){S.monsters=[['Slime','🟢',45,8,28,35],['Goblin','👹',60,10,58,47],['Bat','🦇',50,9,75,30],['Wolf','🐺',70,12,37,73],['Orc','👺',90,15,78,67]].map(a=>({name:a[0],emoji:a[1],hp:a[2],max:a[2],atk:a[3],x:a[4],y:a[5]}))}
function map(){if(!S.monsters.length)spawn();const w=worlds.find(x=>x.grade===S.grade);return `<div class="panel"><div class="world" id="world"><div class="hintbox"></div><div class="lake"></div><div class="forest">🌲🌲🌲</div><div class="mountain">⛰️</div><div class="place" style="left:18%;top:82%">🏘️ Village</div><div class="place" style="left:48%;top:18%">🏰 Dungeon</div><div class="place" style="left:82%;top:78%">🏯 Tower</div><div class="place" style="left:79%;top:25%">👑 Boss Arena</div><div class="npc" style="left:25%;top:48%">🦉</div><div class="place" style="left:25%;top:57%">Professor Owl</div><div class="place" style="left:16%;top:18%">${w.emoji} ${w.name} · Grade ${w.grade}</div><div id="player" class="player" style="left:${S.x}%;top:${S.y}%">🧙</div>${S.monsters.map((m,i)=>`<button class="monster" style="left:${m.x}%;top:${m.y}%" onclick="encounter(${i})">${m.emoji}</button>`).join('')}<div class="controls"><button class="up" onclick="move(0,-1)">▲</button><button class="left" onclick="move(-1,0)">◀</button><button class="down" onclick="move(0,1)">▼</button><button class="right" onclick="move(1,0)">▶</button></div></div><div class="grid"><div class="card"><b>🧙 Player</b><p class="muted">Di chuyển bằng WASD / Arrow Keys hoặc các nút trên màn hình.</p></div><div class="card"><b>🏰 ${t('dungeon')}</b><p class="muted">5 tầng prototype.</p><button onclick="startDungeon()">${t('start')}</button></div><div class="card"><b>🏯 ${t('tower')}</b><p class="muted">5 tầng prototype.</p><button onclick="startTower()">${t('start')}</button></div></div></div>`}
let keyHandler=null;function bindKeys(){if(keyHandler)window.removeEventListener('keydown',keyHandler);keyHandler=e=>{if(S.mode!=='map')return;const k=e.key.toLowerCase();if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){e.preventDefault();if(k==='w'||k==='arrowup')move(0,-1);if(k==='s'||k==='arrowdown')move(0,1);if(k==='a'||k==='arrowleft')move(-1,0);if(k==='d'||k==='arrowright')move(1,0)}};window.addEventListener('keydown',keyHandler)}function move(dx,dy){if(!S.grade||S.mode!=='map')return;S.x=Math.max(4,Math.min(94,S.x+dx*3));S.y=Math.max(6,Math.min(94,S.y+dy*3));const p=document.getElementById('player');if(p){p.style.left=S.x+'%';p.style.top=S.y+'%';p.classList.add('walk');setTimeout(()=>p.classList.remove('walk'),180)}for(let i=S.monsters.length-1;i>=0;i--){const m=S.monsters[i];if(Math.hypot(S.x-m.x,S.y-m.y)<6){encounter(i);break}}save()}
function encounter(i){const m=S.monsters[i];if(!m)return;S.battle={m,index:i,q:null,combo:0};S.mode='battle';render()}function nextQuestion(){const pool=bank.filter(q=>q.grade===S.grade),recent=new Set(S.history.slice(-30).map(x=>x.id)),weak=pool.filter(q=>S.mistakes[q.id]?.count>=2);let c=(weak.length&&Math.random()<.4?weak:pool).filter(q=>!recent.has(q.id));if(!c.length)c=pool;return c[Math.floor(Math.random()*c.length)]}
function battle(){const b=S.battle;if(!b.q)b.q=nextQuestion();const q=b.q,m=b.m;let input=q.type==='mc'?`<div class="options">${q.o.map(o=>`<button onclick="answer(${JSON.stringify(o)})">${o}</button>`).join('')}</div>`:`<input id="answer" style="width:100%;padding:12px;border-radius:9px;border:1px solid #53658f;background:#080d1b;color:#fff" placeholder="Your answer"><button class="primary" style="margin-top:9px" onclick="answer(document.getElementById('answer').value)">⚔️ Attack</button>`;return `<div class="panel"><div class="row"><button onclick="setMode('map')">← ${t('back')}</button><span class="badge">${q.skill} · ${'⭐'.repeat(q.difficulty)} · ${q.id}</span></div><div class="battle"><div class="fighter"><div class="avatar">${m.emoji}</div><b>${m.name}</b><p>${m.hp}/${m.max} HP</p><div class="bar"><div class="fill" style="width:${m.hp/m.max*100}%"></div></div></div><div class="question"><h2>${q.q}</h2>${input}<div id="feedback"></div></div><div class="fighter"><div class="avatar">🧙</div><b>Player</b><p>❤️ ${S.hp}/${S.maxHp}</p><p>⚔️ ${S.atk} · 🛡️ ${S.def}</p><p>🔥 Combo x${b.combo}</p></div></div></div>`}
function answer(value){const q=S.battle.q,n=x=>String(x).trim().toLowerCase().replace(/[.!?]+$/,''),ok=n(value)===n(q.a);S.history.push({id:q.id,correct:ok,at:Date.now()});if(!ok){S.mistakes[q.id]=S.mistakes[q.id]||{count:0,correct:0};S.mistakes[q.id].count++;S.battle.combo=0;const dmg=Math.max(4,S.battle.m.atk-Math.floor(S.def/3));S.hp=Math.max(1,S.hp-dmg);showFeedback(false,q,'-'+dmg+' HP')}else{if(S.mistakes[q.id])S.mistakes[q.id].correct++;S.battle.combo++;const dmg=S.atk+S.battle.combo*2;S.battle.m.hp=Math.max(0,S.battle.m.hp-dmg);S.gold+=10;gain(18+q.difficulty*5);showFeedback(true,q,'-'+dmg+' HP');if(S.battle.m.hp<=0){S.kills++;S.streak++;S.gold+=15;S.monsters.splice(S.battle.index,1);save();setTimeout(()=>{S.mode='map';render();toast('🏆 '+S.battle.m.name+' defeated!')},450);return}}save()}function showFeedback(ok,q,dmg){const e=document.getElementById('feedback');if(!e)return;e.innerHTML=`<div class="feedback"><b>${ok?'✅ '+t('correct'):'❌ '+t('wrong')}</b><p>${dmg}</p>${ok?'':'<p><b>Correct:</b> '+q.a+'</p>'}<p>📚 <b>Why?</b> ${q.e}</p><button onclick="continueBattle()">Continue</button></div>`}function continueBattle(){S.battle.q=null;save();render()}
function bag(){return `<div class="panel"><h2>🎒 ${t('bag')}</h2><div class="grid">${[['potion','❤️ Health Potion'],['hint','💡 Hint'],['skip','⏭️ Skip Ticket'],['shield','🛡️ Shield']].map(([k,n])=>`<div class="card"><b>${n}</b><h2>${S.inventory[k]}</h2>${k==='potion'?'<button onclick="usePotion()">Use</button>':''}</div>`).join('')}</div><h3>⚔️ Equipment</h3>${S.equipment.map(x=>`<div class="card">✨ ${x}</div>`).join('')}</div>`}function usePotion(){if(S.inventory.potion>0&&S.hp<S.maxHp){S.inventory.potion--;S.hp=Math.min(S.maxHp,S.hp+40);save();render()}}
function shop(){const items=[['potion','❤️ Health Potion',35],['hint','💡 Hint',45],['skip','⏭️ Skip Ticket',70],['shield','🛡️ Shield',80]];return `<div class="panel"><div class="row"><h2>🏪 ${t('shop')}</h2><b>💰 ${S.gold}</b></div><div class="grid">${items.map(([k,n,p])=>`<div class="card"><div class="row"><b>${n}</b><button onclick="buy('${k}',${p})">${p} 💰</button></div></div>`).join('')}</div></div>`}function buy(k,p){if(S.gold<p)return toast('Không đủ vàng');S.gold-=p;S.inventory[k]++;save();render()}
function mistakes(){const arr=Object.entries(S.mistakes).sort((a,b)=>b[1].count-a[1].count);return `<div class="panel"><h2>📖 ${t('mistakes')}</h2><p class="muted">Câu sai nhiều sẽ được ưu tiên xuất hiện lại.</p>${arr.length?arr.map(([id,v])=>{const q=bank.find(x=>x.id===id);return `<div class="review"><b>${q?.q||id}</b><p>❌ ${v.count} · ✅ ${v.correct||0}</p><p>Correct: <b>${q?.a||''}</b></p><p class="muted">${q?.e||''}</p><button onclick="practice('${id}')">${t('practice')}</button></div>`}).join(''):'<div class="card">🎉 Chưa có lỗi!</div>'}</div>`}function practice(id){const q=bank.find(x=>x.id===id);if(!q)return;S.battle={m:{name:'Review',emoji:'📚',hp:35,max:35,atk:0},index:-1,q,combo:0};S.mode='battle';render()}
function profile(){const total=S.history.length,correct=S.history.filter(x=>x.correct).length,acc=total?Math.round(correct/total*100):0;return `<div class="panel"><h2>👤 ${t('profile')}</h2><div class="grid"><div class="card"><div style="font-size:60px">🧙</div><h2>Level ${S.level}</h2><div class="bar"><div class="fill" style="width:${S.exp/need()*100}%"></div></div><p>${S.exp}/${need()} EXP</p></div><div class="card"><b>⚔️ Combat</b><p>❤️ ${S.hp}/${S.maxHp}</p><p>⚔️ ATK ${S.atk} · 🛡️ DEF ${S.def}</p><p>👹 Defeated: ${S.kills}</p></div><div class="card"><b>📚 Learning</b><p>Questions: ${total}</p><p>Accuracy: <b>${acc}%</b></p><p>🔥 Streak: ${S.streak}</p><p>Question bank: <b>${bank.length.toLocaleString()}</b></p></div></div></div>`}
function startDungeon(){S.mode='dungeon';S.floor=1;S.tower=false;save();render()}function startTower(){S.mode='dungeon';S.floor=1;S.tower=true;save();render()}function dungeon(){const boss=S.floor===5;return `<div class="panel"><div class="row"><h2>${S.tower?'🏯 Tower of Knowledge':'🏰 Dungeon'} · Floor ${S.floor}/5</h2><button onclick="setMode('map')">← ${t('back')}</button></div><div class="card" style="text-align:center;padding:35px"><div style="font-size:75px">${boss?'👑':'👹'}</div><h2>${boss?'World Boss':'Elite Monster'}</h2><p class="muted">Tầng càng cao, câu hỏi càng khó.</p><button class="primary" onclick="floorFight()">⚔️ Enter Battle</button></div></div>`}function floorFight(){const boss=S.floor===5;S.battle={m:{name:boss?'World Boss':'Elite Monster',emoji:boss?'🐲':'👺',hp:boss?160:85,max:boss?160:85,atk:boss?20:13},index:-1,q:null,combo:0};S.mode='battle';render()}
function setMode(m){S.mode=m;save();render()}function toggleLang(){lang=lang==='vi'?'en':'vi';localStorage.setItem('eqLang',lang);render()}render();
</script></body></html>
